<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<ol class="bl-plan pv-half">
<li data-state="done"><span class="bl-plan__state"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span>Find overdue invoices</span><span class="bl-badge bl-badge--success">Done</span></li>
<li data-state="running"><span class="bl-plan__state"><span class="bl-spinner bl-spinner--sm" aria-hidden="true"></span></span><span>Draft 3 reminder emails</span><span class="bl-badge bl-badge--info">Running</span></li>
<li data-state="needs-approval"><span class="bl-plan__state"></span><span>Send 3 reminders to customers</span><span class="pv-row"><button class="bl-btn bl-btn--secondary bl-btn--sm" type="button">Review</button><button class="bl-btn bl-btn--primary bl-btn--sm" type="button">Approve</button></span></li>
<li data-state="pending"><span class="bl-plan__state"></span><span>Record the reminders in history</span><span class="bl-badge">Pending</span></li>
</ol>
</body>
</html>
