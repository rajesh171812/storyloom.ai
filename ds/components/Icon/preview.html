  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-ic { display: grid; justify-items: center; gap: var(--space-2); width: 96px; }
  .pv-ic .pv-cap { margin: 0; }
</style>
