<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accordion preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="bl-accordion pv-half">
<details open><summary>What is included in the free plan?<svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="bl-accordion__panel">Up to 3 active projects, 10 invoices a month and email support.</div></details>
<details><summary>How do I change my billing date?<svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="bl-accordion__panel">Open Billing, choose Payment schedule, then pick a new date.</div></details>
<details><summary>Can I export my invoices?<svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="bl-accordion__panel">Yes. Export any date range as CSV from the Invoices page.</div></details>
</div>
</body>
</html>
