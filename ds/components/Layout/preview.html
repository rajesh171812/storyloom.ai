<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-cell { display: grid; place-items: center; min-height: 48px; border-radius: var(--radius-md); background: var(--color-state-selected-bg); border: var(--border-width-1) solid var(--color-state-selected-border); font: var(--font-label); }
  .pv-box { padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); font: var(--font-body-sm); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-sec"><p class="pv-cap">bl-grid: cells reflow from 4 to 8 to 12 columns as the viewport widens</p><div class="bl-grid"><div class="pv-cell">1</div><div class="pv-cell">2</div><div class="pv-cell">3</div><div class="pv-cell">4</div><div class="pv-cell">5</div><div class="pv-cell">6</div><div class="pv-cell">7</div><div class="pv-cell">8</div><div class="pv-cell">9</div><div class="pv-cell">10</div><div class="pv-cell">11</div><div class="pv-cell">12</div></div></div><div class="pv-sec"><p class="pv-cap">bl-stack (gap space-4)</p><div class="bl-stack pv-half"><div class="pv-box">Title</div><div class="pv-box">Description</div><div class="pv-box">Actions</div></div></div><div class="pv-sec"><p class="pv-cap">bl-cluster (gap space-3, wraps)</p><div class="bl-cluster"><span class="bl-badge">Draft</span><span class="bl-badge bl-badge--info">In review</span><span class="bl-badge bl-badge--success">Approved</span><span class="bl-badge bl-badge--warning">Overdue</span><span class="bl-badge bl-badge--accent">New</span></div></div>
</body>
</html>
