<style>
  html, body { margin: 0; }
  body { background: var(--color-background-default); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; gap: var(--space-6); padding: var(--space-6); }
  .pv-slide { position: relative; width: 596px; height: 336px; overflow: hidden; border-radius: var(--radius-md); }
  .pv-kicker { margin: 0; font: var(--font-label); font-family: var(--font-family-mono); text-transform: uppercase; letter-spacing: 0.1em; }

  /* left: section-divider pattern (tpl-divider) */
  .pv-divider { background: var(--color-action-primary-bg); color: var(--color-action-primary-text); display: flex; flex-direction: column; justify-content: center; padding-left: var(--space-7); }
  .pv-divider .pv-kicker { color: var(--color-action-primary-text); opacity: 0.72; }
  .pv-divider .pv-numeral { margin: var(--space-2) 0 0; font: 700 6.5rem/0.9 var(--font-family-display); letter-spacing: var(--letter-spacing-display); color: var(--color-action-primary-bg-active); }
  .pv-divider h2 { margin: var(--space-3) 0 0; font: var(--font-h2); letter-spacing: var(--letter-spacing-h2); font-weight: 700; color: var(--color-action-primary-text); }

  /* right: hero + framed photo (tpl-hero-sec / bl-photo-frame) */
  .pv-hero { display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-7); background: var(--color-background-default); }
  .pv-hero-text { flex: 1 1 auto; min-width: 0; }
  .pv-hero-text .pv-kicker { color: var(--color-action-secondary-text); }
  .pv-hero-text h1 { margin: var(--space-3) 0 var(--space-3); font: 700 2.5rem/1.05 var(--font-family-display); letter-spacing: var(--letter-spacing-display); }
  .pv-hero-text p { margin: 0; max-width: 26ch; color: var(--color-text-secondary); font: var(--font-body-lg); }
  .pv-hero-photo { flex: 0 0 220px; aspect-ratio: 4 / 3; border-radius: var(--radius-md); }
</style>
