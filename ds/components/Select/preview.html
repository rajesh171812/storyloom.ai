<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); align-items: start; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-cols">
<div class="bl-field"><label class="bl-label" for="sl1">Country</label><div class="bl-select-wrap"><select class="bl-select" id="sl1"><option>United Kingdom</option><option>Canada</option><option>Germany</option></select><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></div>
<div class="bl-field"><label class="bl-label" for="sl2">Currency</label><div class="bl-select-wrap"><select class="bl-select" id="sl2" disabled><option>USD ($)</option></select><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></div>
<div class="bl-field"><label class="bl-label" for="sl3">Payment terms</label><div class="bl-select-wrap"><select class="bl-select" id="sl3" aria-invalid="true" aria-describedby="sl3e"><option value="">Choose terms</option><option>Net 15</option><option>Net 30</option></select><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><p class="bl-error" id="sl3e"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>Choose payment terms to continue.</span></p></div>
</div>
</body>
</html>
