<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); align-items: start; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-cards">
<article class="bl-card"><h3 class="bl-card__title">Website redesign</h3><p class="bl-card__body">12 tasks, 3 due this week.</p><div class="bl-card__actions"><button class="bl-btn bl-btn--primary bl-btn--sm" type="button">Open project</button></div></article>
<article class="bl-card bl-card--flat"><h3 class="bl-card__title">Flat card</h3><p class="bl-card__body">No shadow. Use it inside another card or a panel.</p></article>
<article class="bl-card bl-card--sunken"><h3 class="bl-card__title">Sunken card</h3><p class="bl-card__body">Recessed fill, no shadow, for secondary content.</p></article>
<article class="bl-card bl-card--interactive"><h3 class="bl-card__title"><a class="bl-link" href="#">Interactive card</a></h3><p class="bl-card__body">Lifts to shadow-2 on hover.</p></article>
<article class="bl-card bl-card--selected"><h3 class="bl-card__title">Selected card</h3><p class="bl-card__body">2px border and tinted fill.</p></article>
</div>
</body>
</html>
