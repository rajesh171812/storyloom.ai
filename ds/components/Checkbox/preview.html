<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4) var(--space-5); align-items: start; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-cols">
<label class="bl-check"><input type="checkbox"><span class="bl-check__box"></span><span>Email me receipts</span></label>
<label class="bl-check"><input type="checkbox" checked><span class="bl-check__box"></span><span>Remember this card</span></label>
<label class="bl-check"><input type="checkbox" data-indeterminate><span class="bl-check__box"></span><span>Select all invoices</span></label>
<label class="bl-check"><input type="checkbox" disabled><span class="bl-check__box"></span><span>Disabled option</span></label>
<label class="bl-check"><input type="checkbox" checked disabled><span class="bl-check__box"></span><span>Disabled and checked</span></label>
<label class="bl-check" aria-invalid="true"><input type="checkbox" aria-invalid="true"><span class="bl-check__box"></span><span>I accept the terms</span></label>
</div>
<script>
document.querySelectorAll('input[data-indeterminate]').forEach(function (el) { el.indeterminate = true; });
</script>
</body>
</html>
