<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prompt preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-col pv-half">
<form class="bl-prompt"><label class="bl-sr-only" for="pr1">Ask about your invoices</label><textarea id="pr1" rows="2" placeholder="Ask about your invoices"></textarea>
<div class="bl-prompt__bar"><span class="bl-caption bl-text-secondary">Uses your invoices and customers.</span><button class="bl-btn bl-btn--primary bl-btn--icon bl-btn--sm" type="button" aria-label="Send"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></div></form>
<form class="bl-prompt"><label class="bl-sr-only" for="pr2">Ask about your invoices</label><textarea id="pr2" rows="2" disabled>Which invoices are overdue?</textarea>
<div class="bl-prompt__bar"><span class="bl-caption bl-text-secondary">Working&hellip;</span><button class="bl-btn bl-btn--secondary bl-btn--icon bl-btn--sm" type="button" aria-label="Stop generating"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="5" y="5" rx="2"/></svg></button></div></form>
</div>
</body>
</html>
