<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyloom Design System</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-background-default); color: var(--color-text-primary); font-family: var(--font-family-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--color-action-primary-bg); }
  .accent { fill: var(--color-accent-bg); }
  .tint { fill: var(--color-primary-200); }
  .ink { fill: var(--color-surface-inverse); }
  .royal { fill: var(--color-primary-500); }
  .cut { fill: var(--color-background-default); }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-family-display); font-size: 72px; line-height: .95; font-weight: 700; letter-spacing: -.02em; color: var(--color-text-primary); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--color-text-secondary); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>

<div class="cover">

  arrangement one tall blue slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     dot grid at a space-5 pitch, from a 4px-base, mono-typed spec: 40 ground-colored dots cut out of the ink block, 15 out of the blue slab
  scales      sides are multiples of space-4; corners radius-lg; dot radius 2 = half of space-1
