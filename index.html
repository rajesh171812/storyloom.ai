con--xl)."}, {"name": "icon-stroke", "value": "1.75", "usage": "Stroke width of Lucide outline icons (unitless)."}], "note": "Icons are Lucide outline, stroked with currentColor."}, "zIndex": {"tokens": [{"name": "z-base", "value": "0", "usage": "Normal flow."}, {"name": "z-sticky", "value": "100", "usage": "Sticky elements such as headers."}, {"name": "z-dropdown", "value": "200", "usage": "Dropdowns and popovers."}, {"name": "z-overlay", "value": "300", "usage": "Overlays and scrims."}, {"name": "z-modal", "value": "400", "usage": "Modal dialogs."}, {"name": "z-toast", "value": "500", "usage": "Toasts."}, {"name": "z-tooltip", "value": "600", "usage": "Tooltips (always on top)."}]}, "duration": {"tokens": [{"name": "duration-instant", "value": "0ms", "usage": "No animation."}, {"name": "duration-fast", "value": "120ms", "usage": "Hover, press and toggle transitions (buttons, inputs, switches, tooltips)."}, {"name": "duration-normal", "value": "240ms", "usage": "Menus, accordions and card elevation changes."}, {"name": "duration-slow", "value": "400ms", "usage": "Dialogs and progress bar changes."}], "note": "Animate only state changes the person caused. prefers-reduced-motion shrinks every duration to near zero."}, "easing": {"tokens": [{"name": "easing-standard", "value": "cubic-bezier(0.2, 0, 0, 1)", "usage": "Default easing for state changes."}, {"name": "easing-enter", "value": "cubic-bezier(0, 0, 0.2, 1)", "usage": "Elements entering the screen."}, {"name": "easing-exit", "value": "cubic-bezier(0.4, 0, 1, 1)", "usage": "Elements leaving the screen."}]}, "breakpoint": {"tokens": [{"name": "breakpoint-tablet", "value": "768px", "usage": "Tablet starts here (8 columns). Below it is mobile (4 columns). Use the literal 768px in @media rules."}, {"name": "breakpoint-desktop", "value": "1024px", "usage": "Desktop starts here (12 columns). Use the literal 1024px in @media rules."}, {"name": "breakpoint-wide", "value": "1440px", "usage": "Wide screens; equals layout-page-max."}], "note": "Mobile first: under 768px mobile, 768 to 1023px tablet, 1024px and up desktop."}, "layout": {"tokens": [{"name": "layout-container-max", "value": "1200px", "usage": "Maximum width of the content container (bl-container)."}, {"name": "layout-page-max", "value": "1440px", "usage": "Maximum page width."}, {"name": "layout-prose-max", "value": "68ch", "usage": "Maximum line length of body text (bl-prose, AI message body)."}, {"name": "layout-sidebar-width", "value": "264px", "usage": "Desktop sidebar navigation width."}, {"name": "layout-sidebar-collapsed", "value": "72px", "usage": "Tablet icon-rail width."}]}}, "components": [{"name": "Accordion", "group": "Data display", "height": 279, "width": null, "subtitle": "Native details and summary with a chevron", "readme": "A bordered stack of native `<details>` disclosures, each with a 48px summary row and a rotating chevron.\n\n```\nComponent:  Accordion\nPurpose:    Reveal secondary content on demand.\nParts:      .bl-accordion > details > summary (label + chevron icon) + .bl-accordion__panel\nStates:     collapsed, expanded (details[open]), hover, focus\nRules:      Use native details and summary. Summary labels are in sentence case.\nA11y:       Native disclosure semantics and keyboard support; the summary is at least 48px tall.\n            The chevron rotates 180 degrees when open (duration-fast) and is decorative.\nCode:       <div class=\"bl-accordion\"><details><summary>Question<svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"/><\/svg><\/summary>\n              <div class=\"bl-accordion__panel\">Answer<\/div><\/details><\/div>\n```\n"}, {"name": "AiMessage", "group": "AI", "height": 350, "width": null, "subtitle": "Labeled AI answer with citations and sources", "readme": "An AI-generated message with its author line, an \"AI-generated\" label, body text with numbered citations, follow-up actions and a source list.\n\n```\nComponent:  AiMessage\nPurpose:    Present generated content so people can tell it is generated and check where it came from.\nParts:      article.bl-ai-msg > .bl-ai-msg__who + p.bl-ai-msg__body (with a.bl-cite) + .bl-ai-msg__meta + ol of li.bl-source\n            bl-stream-cursor marks text that is still arriving\nRules:      Label generated content (\"AI-generated\"). Show sources with numbered citations and say what data was used.\n            Make output editable, rejectable, regenerable and undoable, with a Stop control while working.\n            The body is limited to 68ch (--layout-prose-max).\nErrors:     Refusals and errors say what could not be done and what to try.\nA11y:       Do not announce streaming text token by token to screen readers; announce start and completion.\n            Each citation is a link with an accessible name (\"Source 1\"); the number never carries meaning alone.\nCode:       <p class=\"bl-ai-msg__body\">Three invoices are overdue.<a class=\"bl-cite\" href=\"#s1\" aria-label=\"Source 1\">1<\/a><\/p>\n```\n\nThe citation chip uses `color-state-selected-bg` with `color-state-selected-border`; a source row is a 1px-bordered row on `color-surface-default`.\n"}, {"name": "Alert", "group": "Feedback", "height": 626, "width": null, "subtitle": "Info, success, warning, error and banner", "readme": "An inline message tied to a place on the page, with a status icon, a title, a body, optional actions and an optional dismiss button.\n\n```\nComponent:  Alert\nPurpose:    Give feedback about the content next to it, or about page-wide or account-wide state (banner).\nVariants:   info (default) | bl-alert--success | bl-alert--warning | bl-alert--error | bl-alert--banner (full-bleed, no side borders)\nParts:      .bl-alert > svg.bl-icon + div(.bl-alert__title, .bl-alert__body, .bl-alert__actions) + dismiss button (optional)\nRules:      Use an alert for a message tied to a place on the page; a banner for page-wide or account-wide state;\n            a toast for confirmation of an action just taken. Never use color alone: every tone has an icon and a title.\n            Errors state what happened and how to fix it, without apologizing or blaming.\n            Not \"Something went wrong.\" but \"We couldn't save your changes. Check your connection and try again.\"\nA11y:       The title uses status-*-fg on status-*-bg (4.5:1 or more in both themes); the icon uses status-*-solid (3:1 or more).\n            Give a dismiss button an aria-label. The error summary on a form uses role=\"alert\".\nCode:       <div class=\"bl-alert bl-alert--error\" role=\"alert\"><svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">...<\/svg>\n              <div><p class=\"bl-alert__title\">Payment failed<\/p><p class=\"bl-alert__body\">...<\/p><\/div><\/div>\n```\n"}, {"name": "Avatar", "group": "Data display", "height": 112, "width": null, "subtitle": "Initials in a circle, three sizes", "readme": "A circular avatar showing initials on the selected-state fill, in small, default and large sizes.\n\n```\nComponent:  Avatar\nPurpose:    Identify a person or account compactly.\nSizes:      bl-avatar--sm 24 | default 40 | bl-avatar--lg 48\nRules:      Show initials. Give the avatar an accessible name (role=\"img\" with aria-label) unless the name appears next to it.\n            The fill is color-state-selected-bg with a 1px color-state-selected-border; text is color-text-primary.\nA11y:       Initials are text, not an image, so they scale with zoom. Decorative avatars next to a name use aria-hidden=\"true\".\nCode:       <span class=\"bl-avatar\" role=\"img\" aria-label=\"Ana Ruiz\">AR<\/span>\n```\n\nText size scales with the avatar (36% of its width). An image can be placed inside; the circle clips it.\n"}, {"name": "Badge", "group": "Data display", "height": 88, "width": null, "subtitle": "Status pills that always carry an icon or a word", "readme": "A small pill for the status of an item, in a neutral, success, warning, error, info or accent tone.\n\n```\nComponent:  Badge\nPurpose:    Show the status of an item.\nVariants:   default | success | warning | error | info | accent\nRules:      A status badge always has an icon or a word, never color alone. Sentence case.\n            Use bl-tag, not a badge, for labels people add and can remove.\n            The accent badge (lavender) is for rare highlights such as \"New\".\nA11y:       Text meets 4.5:1 on its tinted fill in both themes (status-*-fg on status-*-bg; accent-text on accent-bg).\nCode:       <span class=\"bl-badge bl-badge--success\"><svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg>Paid<\/span>\n```\n\nThe icon inside a badge is drawn at 12px automatically. The pill is 24px tall with a 1px border in the tone's border color.\n"}, {"name": "Breadcrumb", "group": "Navigation", "height": 60, "width": null, "subtitle": "Slash-separated path to the current page", "readme": "A wrapping list of links separated by slashes, ending in the current page.\n\n```\nComponent:  Breadcrumb\nPurpose:    Show where the page sits in the hierarchy and let people go up a level.\nParts:      nav.bl-breadcrumb[aria-label=\"Breadcrumb\"] > ol > li > a ; the last li has aria-current=\"page\"\nRules:      The current page is not a link and is set in color-text-primary at medium weight.\n            Ancestors are links in color-text-link; the slash separators are decorative and added by CSS.\nA11y:       Wrap in a nav with aria-label=\"Breadcrumb\" and use an ordered list. Mark the last item aria-current=\"page\".\nCode:       <nav class=\"bl-breadcrumb\" aria-label=\"Breadcrumb\"><ol><li><a href=\"/projects\">Projects<\/a><\/li><li aria-current=\"page\">Invoices<\/li><\/ol><\/nav>\n```\n"}, {"name": "Button", "group": "Actions", "height": 464, "width": null, "subtitle": "Five variants, three sizes, every state", "readme": "Triggers an action within a workflow: five variants, three sizes, and every state rendered from tokens.\n\n```\nComponent:  Button\nPurpose:    Trigger an action within a workflow.\nVariants:   primary | secondary | tertiary | ghost | destructive\nSizes:      sm (32) | md (40, default) | lg (48); on touch devices (pointer: coarse) sm 40 | md 44 | lg 52\nStates:     default, hover, pressed, focus, disabled, loading\nRules:      One primary per section. Label = verb + object (\"Create account\", \"Send invoice\"), never \"Submit\" or \"OK\".\n            Destructive only for deleting or irreversible actions, and never the default focus in a confirmation dialog.\n            Loading keeps the width and the focus, sets aria-busy=\"true\" and shows bl-spinner bl-spinner--sm.\n            Icon-only buttons (bl-btn--icon) require aria-label.\nResponsive: A lone primary is full width below 768px (bl-btn--block); a stacked pair is full width too.\nA11y:       Native <button>; 2px focus ring in color-border-focus; 4.5:1 label contrast in both themes.\nCode:       <button class=\"bl-btn bl-btn--primary\" type=\"button\">Create account<\/button>\n```\n\nThe consumer provides the label text and, for icon buttons, an inline `bl-icon` SVG (icon first, then the label). Add `bl-btn--sm` or `bl-btn--lg` for the other sizes and `bl-btn--block` for full width. Disable with the `disabled` or `aria-disabled=\"true\"` attribute, not a class.\n\nThe `is-hover`, `is-active` and `is-focus` classes exist only so documentation can show every state at once; do not use them in product code.\n\n`window.Storyloom.Button` is the reference React wrapper: `<Button variant=\"primary\" icon={<Plus className=\"bl-icon\" aria-hidden />}>New project<\/Button>`. It warns when an icon-only button has no `aria-label`.\n"}, {"name": "Card", "group": "Data display", "height": 458, "width": null, "subtitle": "Raised, flat, sunken, interactive and selected", "readme": "A bordered surface with 24px padding, an optional title, body and action row, in raised, flat, sunken, interactive and selected variants.\n\n```\nComponent:  Card\nPurpose:    Group rich content about one item.\nParts:      .bl-card > .bl-card__title + .bl-card__body + .bl-card__actions\nVariants:   default (shadow-1) | bl-card--flat | bl-card--sunken | bl-card--interactive | bl-card--selected\nRules:      Use a card list for fewer than 5 records or rich content per item; use bl-table to compare 5 or more records.\n            Never stack shadows: a card inside a card is bl-card--flat.\n            Selected shows a 2px border and tinted fill, so selection never relies on color alone.\nResponsive: 1 card per row on mobile, 2 on tablet, 3 to 4 on desktop.\nA11y:       Give an interactive card a native link or button as its main control so it is keyboard reachable.\nCode:       <article class=\"bl-card\"><h3 class=\"bl-card__title\">Website redesign<\/h3><p class=\"bl-card__body\">12 tasks, 3 due this week.<\/p><\/article>\n```\n\nRadius is `radius-lg`, border `color-border-default`, fill `color-surface-default`. The interactive variant lifts to `shadow-2` and `color-border-strong` on hover.\n"}, {"name": "Checkbox", "group": "Forms", "height": 144, "width": null, "subtitle": "Checked, indeterminate, disabled and invalid", "readme": "A native checkbox drawn with a 20px token-styled box, for on/off choices that are saved later and for multi-select lists.\n\n```\nComponent:  Checkbox\nPurpose:    Let people select zero or more options, or set an on/off value that needs a Save button.\nParts:      label.bl-check > input[type=checkbox] + span.bl-check__box + span (label text)\nStates:     unchecked, checked, indeterminate, hover, focus, disabled, invalid\nRules:      Use for on/off that needs a Save button; use bl-switch when the change applies immediately.\n            The label text is always visible and part of the click target.\n            Invalid: set aria-invalid=\"true\" on the label (styling hook) and on the input, and show an error line with icon and text.\nA11y:       Native input (24px hit area), 2px focus ring on the box, checked state shows a check mark and not color alone.\n            Set indeterminate with JavaScript (input.indeterminate = true) for a partly selected group.\nCode:       <label class=\"bl-check\"><input type=\"checkbox\"><span class=\"bl-check__box\"><\/span><span>Email me receipts<\/span><\/label>\n```\n"}, {"name": "DeviceFrames", "group": "Presentation", "height": 330, "width": null, "subtitle": "Transparent frames; the screenshot sits behind", "readme": "Transparent device frames with measured screen areas. The real screenshot goes underneath and fills the screen area exactly. Files are in the asset group *Device frames*.\n\n```\nComponent:  DeviceFrames\nPurpose:    Show a real product screen in context on a slide or page.\nParts:      .cx-device (width set; --x --y --w --h = screen area in % of the frame) > .cx-device__screen (the screenshot) + img (the frame)\nFrames:     DEVICE-IPHONE-01 iPhone 15 Pro 664\u00d71328 [4.97, 2.18, 90.21, 95.63]   Approved, default mobile\n            DEVICE-IPHONE-02 iPhone notch 600\u00d71210 [6.0, 2.56, 88.17, 94.88]      Conditional: notch-era captures, RCS\n            DEVICE-IPAD-01 iPad portrait 1803\u00d72353 [4.22, 3.27, 91.51, 93.54]     Approved\n            DEVICE-IPAD-02 iPad landscape 2352\u00d71803 [3.15, 4.1, 93.62, 91.63]     Approved\n            DEVICE-LAPTOP-01 MacBook Air 2016\u00d71136 [12.3, 5.81, 75.5, 84.15]      Approved\n            DEVICE-BROWSER-01 Browser 3084\u00d71962 [3.31, 10.7, 93.39, 81.55]        Approved\n            DEVICE-DESKTOP-01 Monitor draft 1600\u00d71156 [2.25, 3.11, 95.5, 73.7]    Restricted: approval per use\nRules:      Real screenshots only; never redraw product UI inside a frame. One frame family per slide.\n            Front-facing, never stretched, no added tilt or shadow. Same product on several slides: same frame.\nA11y:       The frame image is decorative (alt=\"\"); the screenshot carries the alt text.\n```\n"}, {"name": "Dialog", "group": "Feedback", "height": 328, "width": null, "subtitle": "Confirmation dialog on the scrim", "readme": "A modal surface with a 16px radius, shadow-3 and a scrim behind it, for confirming an irreversible action or a focused task.\n\n```\nComponent:  Dialog\nPurpose:    Confirm an irreversible action, or hold a short focused task.\nParts:      dialog.bl-dialog > h2.bl-dialog__title + p.bl-dialog__body + .bl-dialog__actions\n            The backdrop is dialog::backdrop in color-overlay-scrim; .bl-scrim paints the same surface for documentation.\nRules:      Use a dialog for an irreversible action. Title = action + object (\"Delete project?\"), body = the consequence,\n            buttons repeat the verb (\"Delete project\" / \"Keep project\"). Destructive is never the default focus.\nResponsive: Spec: mobile is a full-width bottom sheet; tablet and desktop a centered dialog, max 480px. components.css centers the dialog\n            at every width (width min(480px, 100%)), so a bottom sheet on mobile needs a layout override.\nA11y:       Use a native <dialog> opened with showModal() so focus is trapped and Escape closes it; set aria-labelledby to the title\n            and aria-describedby to the body.\nCode:       <dialog class=\"bl-dialog\" aria-labelledby=\"t\"><h2 class=\"bl-dialog__title\" id=\"t\">Delete project?<\/h2>\n              <p class=\"bl-dialog__body\">This permanently deletes the project and its 12 tasks.<\/p>\n              <div class=\"bl-dialog__actions\"><button class=\"bl-btn bl-btn--secondary\" autofocus>Keep project<\/button>\n              <button class=\"bl-btn bl-btn--destructive\">Delete project<\/button><\/div><\/dialog>\n```\n"}, {"name": "Divider", "group": "Foundations", "height": 137, "width": null, "subtitle": "A 1px hairline between blocks", "readme": "A horizontal rule drawn as a 1px `color-border-default` line with `space-5` above and below.\n\n```\nComponent:  Divider\nPurpose:    Separate two blocks of related content.\nRules:      Use a native <hr class=\"bl-divider\">. Prefer spacing to a divider when the grouping is already clear.\n            The line is decorative (about 1.3:1 on surface-default), so it never carries meaning alone.\nCode:       <hr class=\"bl-divider\">\n```\n"}, {"name": "EmptyState", "group": "Data display", "height": 312, "width": null, "subtitle": "What this is, why it is empty, one action", "readme": "A centered block for a data view with nothing in it: an icon disc, a title, one sentence and a single action.\n\n```\nComponent:  EmptyState\nPurpose:    Explain an empty view and offer the next step.\nParts:      .bl-empty > .bl-empty__icon (icon) + h3 + p + one button\nRules:      Say what this is, why it is empty, and give one action.\n            Example: \"No invoices yet. Invoices you send will appear here.\" + [Create invoice]\n            The paragraph is limited to 40ch. Do not use an empty state for errors: an error view says what happened and offers a retry.\nA11y:       The icon is decorative (aria-hidden). Keep the h3 in sequence with the surrounding headings.\nCode:       <div class=\"bl-empty\"><span class=\"bl-empty__icon\"><svg class=\"bl-icon bl-icon--lg\" aria-hidden=\"true\" viewBox=\"0 0 24 24\">...<\/svg><\/span>\n              <h3>No invoices yet<\/h3><p>Invoices you send will appear here.<\/p><button class=\"bl-btn bl-btn--primary\" type=\"button\">Create invoice<\/button><\/div>\n```\n"}, {"name": "Header", "group": "Navigation", "height": 97, "width": null, "subtitle": "56px top bar on the page margin", "readme": "A top bar at least 56px tall with the surface fill, a bottom border and horizontal padding that follows the page margin.\n\n```\nComponent:  Header\nPurpose:    Hold the brand, primary links and account controls at the top of a page.\nParts:      header.bl-header > brand + links + account controls (contents are yours; gap is space-4)\nRules:      The header supplies height, padding (--grid-margin: 16 / 24 / 32), fill and border only; lay out its children with flex.\n            Landmarks: use <header> for the bar and <nav> around its links. Keep the primary action reachable at every width;\n            on mobile move links into a menu button rather than dropping them.\nA11y:       Icon-only controls need aria-label. Focus rings apply to every control in the bar.\nCode:       <header class=\"bl-header\"><a class=\"bl-h4\" href=\"/\">Storyloom Design System<\/a><nav aria-label=\"Primary\">...<\/nav><\/header>\n```\n"}, {"name": "Icon", "group": "Foundations", "height": 331, "width": null, "subtitle": "Lucide outline, five sizes, currentColor", "readme": "Inline SVG icons drawn as Lucide outlines, stroked with `currentColor` at `--icon-stroke` and sized with one class.\n\n```\nComponent:  Icon\nPurpose:    Reinforce a label or action with a small symbol.\nSizes:      bl-icon--xs 12 | bl-icon--sm 16 | bl-icon (md, 20, default) | bl-icon--lg 24 | bl-icon--xl 32\nStates:     Inherits color from its parent (currentColor); no states of its own.\nRules:      Use Lucide outline icons only, inline as SVG with viewBox=\"0 0 24 24\". Never rely on an icon alone to carry meaning:\n            errors have an icon and text, status badges an icon or a word.\n            Icon-only buttons need aria-label on the button.\nA11y:       Decorative icons carry aria-hidden=\"true\". A standalone informative icon gets role=\"img\" and aria-label.\nCode:       <svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"M12 5v14\"/><\/svg>\n```\n\nInside a small button, a badge, an error message or a stepper dot the icon size steps down automatically (`sm`, `xs`), so do not add a size class there. Change an icon's color by setting `color` on its container, using a semantic token.\n"}, {"name": "IconTile", "group": "Presentation", "height": 330, "width": null, "subtitle": "Rounded is the default icon style on slides", "readme": "The three icon variants of the CX library: rounded tile (default on slides), rounded solid and plain outline.\n\n```\nComponent:  IconTile\nPurpose:    Show an icon as a card, column or section marker on slides and pages.\nVariants:   cx-icon-tile (Rounded, ICN-*-RD, default) | cx-icon-tile--solid (Rounded solid, ICN-*-RS) | plain bl-icon (Outline, ICN-*)\nSizes:      cx-icon-tile--sm 32 | default 40 | cx-icon-tile--lg 56\nRules:      Rounded is the default on slides and in the template decks. Rounded solid marks one emphasis point per slide.\n            Outline is for icons inside pills, badges, table cells and small labels, where a tile would not fit.\n            Icons are Lucide outline, stroke 1.75, from the 111-icon CX library (IDs are ICN- plus the Lucide name).\n            An icon never carries meaning alone: pair it with a word.\nA11y:       The tile is decorative (the svg has aria-hidden); the adjacent text names the item. Icon ink is 7.9:1 on the tile.\nCode:       <span class=\"cx-icon-tile\"><svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u2026<\/svg><\/span>\n```\n"}, {"name": "JourneyMap", "group": "Presentation", "height": 300, "width": null, "subtitle": "Stages across; actions, pains and changes down", "readme": "A journey grid: stages across the top, rows for what the customer does, how they feel, pain points or what changes. CMP-JOURNEY-01 / SLD-JOURNEY-01.\n\n```\nComponent:  JourneyMap\nPurpose:    Show an experience across customer stages, current or future state.\nParts:      .cx-journey (set --cx-stages, default 5) > .cx-journey__label + .cx-journey__stage + .cx-journey__cell[--pain | --gain]\nRules:      3 to 6 stages; the same stage names on the current- and future-state slides.\n            Pain cells use the error tint, change cells the success tint; the row label says which, so color is never alone.\n            A feeling row, when used, is a line through one dot per stage with a word under each dot.\nResponsive: Below 768px scroll the grid horizontally in its own container rather than squeezing cells.\nA11y:       Read row by row: give each row a text label. Keep cell text to one short sentence.\n```\n"}, {"name": "Layout", "group": "Foundations", "height": 530, "width": null, "subtitle": "Container, grid, stack and cluster", "readme": "Four small layout helpers built on the spacing and layout tokens: a centered container, a responsive column grid, a vertical stack and a wrapping cluster.\n\n```\nComponent:  Layout\nPurpose:    Arrange content without one-off spacing.\nClasses:    bl-container | bl-grid | bl-stack | bl-cluster | bl-sr-only\nGrid:       4 columns under 768px, 8 from 768px, 12 from 1024px (--grid-columns). Margin and gutter follow: 16 / 24 / 32 and 16 / 24 / 24.\nRules:      Page max 1440px, content container 1200px (--layout-container-max) plus the page margin on each side.\n            Multi-column content stacks in reading order below 768px. Never hide the primary action, an error or task-critical\n            information at any width; move it instead.\n            Set --stack-gap or --cluster-gap on the element to change the gap; otherwise stack uses space-4 and cluster space-3.\nA11y:       bl-sr-only hides text visually but keeps it for screen readers (skip links, extra context for icon-only controls).\nCode:       <main class=\"bl-container\"><div class=\"bl-grid\">...<\/div><\/main>\n```\n\nBreakpoints are literal in `@media` rules (`768px`, `1024px`, `1440px`), because CSS variables cannot be used there.\n"}, {"name": "Messaging", "group": "Presentation", "height": 420, "width": null, "subtitle": "SMS, RCS and lock-screen drafts (Restricted)", "readme": "Proposed drafts for customer messaging moments shown inside a phone frame: iMessage, SMS, RCS business message and lock-screen notification. All four are Restricted.\n\n```\nComponent:  Messaging\nPurpose:    Show SMS, RCS or notification moments in a journey (SLD-MESSAGING-01).\nPatterns:   MSG-IOS-01 iMessage on DEVICE-IPHONE-01 | MSG-SMS-01 SMS on DEVICE-IPHONE-01\n            MSG-RCS-01 RCS business message on DEVICE-IPHONE-02 | MSG-NOTIFICATION-01 lock screen on DEVICE-IPHONE-01\nStatus:     Restricted (proposed draft): every use needs the owner's approval at GATE-02.\nRules:      Native platform colors (bubble blue, SMS green, system grey) are allowed inside MSG-* only; everything around uses tokens.\n            Brand name, sender and message copy come from the owner. Never invent regulated or clinical wording.\n            Time reads 9:41. No real phone numbers or personal data. Prefer real mockups over these drafts.\nA11y:       Give the slide a text summary of the message; the phone image is supporting.\n```\n"}, {"name": "Pagination", "group": "Navigation", "height": 80, "width": null, "subtitle": "Previous, numbered pages and next", "readme": "A row of ghost buttons for moving through pages of results, with the current page filled in the primary color.\n\n```\nComponent:  Pagination\nPurpose:    Move between pages of a long list or table.\nParts:      nav.bl-pagination > button.bl-btn.bl-btn--ghost (page, previous, next) ; the current page has aria-current=\"page\"\nRules:      Use ghost buttons for page links and icon-only ghost buttons for previous and next. Disable previous on the first page\n            and next on the last. Buttons are at least as wide as they are tall (min-width = button height).\nA11y:       Wrap in a nav with aria-label=\"Pagination\". Give every button an accessible name (\"Page 3\", \"Previous page\"),\n            and mark the current page with aria-current=\"page\". The current page is filled, so it never relies on color alone.\nCode:       <nav class=\"bl-pagination\" aria-label=\"Pagination\"><button class=\"bl-btn bl-btn--ghost\" aria-current=\"page\" aria-label=\"Page 3, current page\">3<\/button><\/nav>\n```\n"}, {"name": "Photography", "group": "Foundations", "height": 280, "width": null, "subtitle": "Photography prints in pure black and white", "readme": "Every photograph prints in pure black and white; color stays with the interface. Two building blocks: a crop frame and the image itself, plus an optional scrim for text on top of a photo.\n\n```\nComponent:  Photography\nPurpose:    Show a photograph inside product UI, a deck slide or a landing page without introducing a second color language.\nClasses:    bl-photo-frame (crop container, set aspect-ratio or height, overflow: hidden)\n            bl-photo (grayscale(1) + object-fit: cover; put this on the <img>)\n            bl-scrim-photo (gradient from color-background-default to transparent; only when text sits on the photo)\nRules:      Grayscale only, no duotone or tint. Every photo needs alt text, or alt=\"\" + role=\"presentation\" if decorative.\n            Crop to 16:9, 4:3, 3:4 or 1:1 \u2014 never stretch or letterbox. A scrim is a gradient, not a contrast guarantee: check it.\nCode:       <div class=\"bl-photo-frame\" style=\"aspect-ratio: 4 / 3\">\n              <img class=\"bl-photo\" src=\"photo.jpg\" alt=\"Describe what the photo shows\">\n            <\/div>\n```\n\nFull rules and the caption/crop table are in the Imagery guideline. The Templates component shows the same treatment used across a full slide deck and landing page.\n"}, {"name": "Plan", "group": "AI", "height": 280, "width": null, "subtitle": "Agent steps with an approval gate", "readme": "A list of steps an AI feature is taking, each with a state marker, a description and a trailing status or action, including a step that needs approval.\n\n```\nComponent:  Plan\nPurpose:    Show what an AI feature will do or is doing, and hold risky steps for approval.\nParts:      ol.bl-plan > li[data-state] > span.bl-plan__state + description + trailing status or buttons\nStates:     pending (default), running, done, needs-approval\nRules:      Any action that sends, spends, deletes or shares requires a preview and explicit approval, and is recorded in a\n            reviewable history. Give a needs-approval step a warning border (2px) and Approve and Review buttons.\n            A done step shows a check in a success-colored circle; a running step shows a small spinner.\nA11y:       Each state also has a word or icon (badge \"Done\", \"Running\", a check, a spinner), never color alone.\n            Announce a step change once when it happens rather than continuously.\nCode:       <ol class=\"bl-plan\"><li data-state=\"needs-approval\"><span class=\"bl-plan__state\"><\/span><span>Send 3 reminders<\/span>\n              <button class=\"bl-btn bl-btn--primary bl-btn--sm\">Approve<\/button><\/li><\/ol>\n```\n"}, {"name": "PresentationCards", "group": "Presentation", "height": 470, "width": null, "subtitle": "KPI, insight, quote and evidence cards", "readme": "The card family CX slides are assembled from: KPI with delta, insight, quote with attribution, evidence with source, and the lavender highlight.\n\n```\nComponent:  PresentationCards\nPurpose:    Carry one number, one finding, one quote or one proof point per card.\nParts:      .cx-kpi (.cx-eyebrow, .cx-kpi__value, .cx-delta[--down], .cx-kpi__note)  = CMP-KPI-01 / CMP-METRIC-01\n            .cx-insight (.cx-eyebrow, .cx-insight__text)                            = CMP-INSIGHT-01\n            .cx-quote (.cx-icon-tile, .cx-quote__text, .cx-quote__who > span)      = CMP-QUOTE-01 + CMP-CUSTOMER-01\n            .cx-evidence (.cx-evidence__value, text, .cx-evidence__source)          = CMP-EVIDENCE-01\n            .cx-highlight                                                            = the one lavender highlight per slide\nRules:      One message per card. A delta always has an icon and a direction word (\"Up\", \"Down (better)\").\n            Quotes are verbatim and attributed to a segment, never invented; placeholders say so.\n            Every number shows its source, method and sample size on the same slide.\n            Use lavender (.cx-highlight) at most once per slide.\nA11y:       Values are text, not images. Delta colors pair with an icon and a word. Insight text is 15:1 on Deep navy.\n```\n"}, {"name": "Progress", "group": "Feedback", "height": 112, "width": null, "subtitle": "Determinate bar for a wait of known length", "readme": "An 8px pill-shaped bar whose fill width shows how far a task of known length has progressed.\n\n```\nComponent:  Progress\nPurpose:    Show progress when the length of the wait is known.\nParts:      .bl-progress[role=progressbar] > span (style=\"width: N%\")\nRules:      Use for a wait of known length; use bl-spinner for a short wait of unknown length and bl-skeleton when the layout is known.\n            Show the value or a label next to the bar so progress never relies on the fill alone.\nA11y:       role=\"progressbar\" with aria-valuemin, aria-valuemax, aria-valuenow and a name via aria-labelledby.\n            The fill animates over duration-slow and stops under prefers-reduced-motion.\nCode:       <div class=\"bl-progress\" role=\"progressbar\" aria-label=\"Upload\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"64\"><span style=\"width:64%\"><\/span><\/div>\n```\n"}, {"name": "Prompt", "group": "AI", "height": 292, "width": null, "subtitle": "Prompt box with Send and Stop", "readme": "A rounded input box for asking an AI feature something, with a borderless textarea, a helper line and a Send or Stop button.\n\n```\nComponent:  Prompt\nPurpose:    Let a person give an instruction or question to an AI feature.\nParts:      form.bl-prompt > textarea + .bl-prompt__bar (helper text + button)\nStates:     idle (Send), focus (2px ring on the whole box), working (Stop replaces Send)\nRules:      Say what data will be used. Show a Stop control while the AI is working.\n            Any action that sends, spends, deletes or shares needs a preview and explicit approval (see bl-plan).\nA11y:       The textarea needs an accessible name: use a visually hidden bl-sr-only label. Icon-only Send and Stop buttons carry aria-label.\n            The whole box shows the focus ring through :focus-within.\nCode:       <form class=\"bl-prompt\"><label class=\"bl-sr-only\" for=\"q\">Ask a question<\/label><textarea id=\"q\"><\/textarea>\n              <div class=\"bl-prompt__bar\"><span class=\"bl-caption bl-text-secondary\">Uses your invoices.<\/span>\n              <button class=\"bl-btn bl-btn--primary bl-btn--icon bl-btn--sm\" aria-label=\"Send\">...<\/button><\/div><\/form>\n```\n"}, {"name": "Radio", "group": "Forms", "height": 200, "width": null, "subtitle": "Radio group inside a fieldset", "readme": "A native radio button with a token-styled 20px circle, grouped in a fieldset with a legend.\n\n```\nComponent:  Radio\nPurpose:    Choose exactly one of 2 to 5 options, all visible at once.\nParts:      fieldset.bl-fieldset > legend + label.bl-radio > input[type=radio] + span.bl-radio__box + span (label text)\nStates:     unselected, selected, hover, focus, disabled\nRules:      Use a radio group for 1 of 2 to 5 options; use bl-select for more. Always wrap the group in a fieldset with a legend.\n            Give every input in the group the same name.\nA11y:       Native inputs give arrow-key navigation inside the group. Selected shows a filled dot, not color alone.\nCode:       <fieldset class=\"bl-fieldset\"><legend>Frequency<\/legend>\n              <label class=\"bl-radio\"><input type=\"radio\" name=\"freq\" checked><span class=\"bl-radio__box\"><\/span><span>Daily<\/span><\/label><\/fieldset>\n```\n"}, {"name": "Select", "group": "Forms", "height": 232, "width": null, "subtitle": "Native select with a chevron", "readme": "A native `<select>` with the Storyloom Design System border, radius and a chevron icon, for choosing one of many options.\n\n```\nComponent:  Select\nPurpose:    Choose one option from a long list.\nParts:      bl-field > label.bl-label + .bl-select-wrap > select.bl-select + svg.bl-icon (chevron-down)\nStates:     default, hover, focus, disabled, invalid\nRules:      Use the native select for choosing 1 of many. Move to a combobox only when the list must be searchable\n            (a combobox is specified but not built). For 2 to 5 options use a radio group instead.\n            Every select has a visible label; mark optional fields \"(optional)\".\nA11y:       Native element: keyboard and screen readers work unchanged. The chevron is decorative (aria-hidden) and ignores pointer events.\nCode:       <div class=\"bl-field\"><label class=\"bl-label\" for=\"country\">Country<\/label>\n              <div class=\"bl-select-wrap\"><select class=\"bl-select\" id=\"country\"><option>United Kingdom<\/option><\/select>\n              <svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"/><\/svg><\/div><\/div>\n```\n\nInvalid and disabled states follow the input: a 2px `color-status-error-solid` border with an error line below, and `state-disabled-bg` with `text-disabled`.\n"}, {"name": "Sidenav", "group": "Navigation", "height": 316, "width": null, "subtitle": "Grouped links with a current-page marker", "readme": "A vertical list of 36px navigation links with group headings and a tinted, marked current item.\n\n```\nComponent:  Sidenav\nPurpose:    Primary navigation for a product area.\nParts:      nav.bl-sidenav > p.bl-sidenav__group + a (icon + label) ; the current link has aria-current=\"page\"\nRules:      Desktop: 264px sidebar (--layout-sidebar-width). Tablet: 72px icon rail (--layout-sidebar-collapsed).\n            Mobile: a menu button with an off-canvas panel, or a bottom nav of at most 5 items.\n            The current item has a tinted fill, a 3px marker and bold text, so it never relies on color alone.\nA11y:       Wrap in a nav with a distinct aria-label. Mark the current link aria-current=\"page\". Icons are decorative.\nCode:       <nav class=\"bl-sidenav\" aria-label=\"Main\"><a href=\"/\" aria-current=\"page\"><svg class=\"bl-icon\" aria-hidden=\"true\">...<\/svg>Overview<\/a><\/nav>\n```\n"}, {"name": "Skeleton", "group": "Feedback", "height": 206, "width": null, "subtitle": "Placeholder shapes while known content loads", "readme": "A shimmering placeholder block that holds the layout of content while it loads.\n\n```\nComponent:  Skeleton\nPurpose:    Reserve the layout of content that is loading.\nParts:      .bl-skeleton blocks sized with width and height in a container that has aria-busy=\"true\"\nRules:      Use when the content layout is known; use bl-spinner with a label when it is not. Every data view has a skeleton\n            loading state, an empty state and an error state. Size blocks with spacing tokens so they match the real content.\nA11y:       Mark the loading region aria-busy=\"true\". Under prefers-reduced-motion the shimmer stops and the block is a flat color-state-hover.\nCode:       <div aria-busy=\"true\"><span class=\"bl-skeleton\" style=\"width: 60%; height: var(--space-4)\"><\/span><\/div>\n```\n"}, {"name": "SlideTemplates", "group": "Presentation", "height": 340, "width": null, "subtitle": "16:9 slides built from the presentation cards", "readme": "The governed 16:9 slide layouts. Each has an SLD-* ID, a status and the components it is built from; the full list, wireframes and template decks are in Storyloom AI Presentation spec and site.\n\n```\nComponent:  SlideTemplates\nPurpose:    Lay out one message per slide on a 1280 \u00d7 720 canvas (13.333 \u00d7 7.5 in).\nParts:      .cx-slide[--title] > .cx-slide__kicker + .cx-slide__title + body built from PresentationCards, JourneyMap, DeviceFrames\nTemplates:  24 approved or conditional SLD-* layouts: title, section, executive summary, statement, KPI grid, KPI + trend,\n            chart focus, insight + evidence, quote, persona, 2- and 3-column, before/after, variants, journey, process,\n            timeline, priority matrix, device hero, cross-device, messaging (Restricted), recommendations, next steps, bullet list.\nRules:      Title and section slides sit on Deep navy; content slides on the page ground. Titles state the takeaway.\n            Slide margin 48px (space-8), card padding 24px, gaps 16px. Lavender once per slide.\n            Type (canvas px): title 40/48 Bricolage 700, KPI 56/60, card title 20/28, body 18/28 Hanken, source 14/20 minimum.\n            Icons use the Rounded tile. Every claim shows its evidence on the slide.\nA11y:       Text 4.5:1 on its ground; charts are native and direct-labelled; each slide reads without color.\n```\n"}, {"name": "Spinner", "group": "Feedback", "height": 142, "width": null, "subtitle": "Short wait of unknown length, with a label", "readme": "A rotating ring in `currentColor`, 20px by default and 16px small, for a short wait of unknown length.\n\n```\nComponent:  Spinner\nPurpose:    Show that something is loading when the wait is short and its length unknown.\nSizes:      bl-spinner (icon-md 20) | bl-spinner--sm (icon-sm 16)\nRules:      Always pair the spinner with a text label (\"Loading invoices\"). In a button, use bl-spinner--sm, set aria-busy=\"true\"\n            and keep the button width and focus. Use bl-skeleton when the layout is known and bl-progress when the length is known.\nA11y:       The ring is decorative (aria-hidden=\"true\"); put role=\"status\" on the container that holds the label.\n            Under prefers-reduced-motion it stops rotating and becomes a dotted ring.\nCode:       <div role=\"status\"><span class=\"bl-spinner\" aria-hidden=\"true\"><\/span> Loading invoices<\/div>\n```\n"}, {"name": "Stepper", "group": "Navigation", "height": 76, "width": null, "subtitle": "Progress through a multi-step task", "readme": "A row of equal steps with a 4px bar above each, a numbered or checked dot and a label, showing where a person is in a multi-step task.\n\n```\nComponent:  Stepper\nPurpose:    Show progress through a fixed sequence of steps.\nParts:      ol.bl-stepper > li.bl-step > span.bl-step__label > span.bl-step__dot + text\nStates:     upcoming (default), complete (data-state=\"complete\", check icon in the dot), current (aria-current=\"step\")\nRules:      Completed steps show a check icon and current step is bold, so state never relies on color alone.\n            Keep labels short, in sentence case.\nA11y:       Use an ordered list with aria-label, mark the current step with aria-current=\"step\", and add visually hidden text\n            (bl-sr-only) such as \"Completed:\" for finished steps.\nCode:       <ol class=\"bl-stepper\" aria-label=\"Checkout\"><li class=\"bl-step\" aria-current=\"step\"><span class=\"bl-step__label\"><span class=\"bl-step__dot\">2<\/span>Payment<\/span><\/li><\/ol>\n```\n"}, {"name": "Switch", "group": "Forms", "height": 184, "width": null, "subtitle": "On/off that applies immediately", "readme": "A checkbox styled as a 40 by 24 toggle for settings that take effect the moment they change.\n\n```\nComponent:  Switch\nPurpose:    Turn a setting on or off immediately.\nParts:      label.bl-switch > input[type=checkbox][role=switch] + span.bl-switch__track + span (label text)\nStates:     off, on, hover, focus, disabled\nRules:      Use when the change applies immediately; use bl-check when the choice needs a Save button.\n            The label stays visible next to the toggle and is part of the click target.\nA11y:       role=\"switch\" on a native checkbox; the thumb moves and the track fills, so state never relies on color alone.\n            2px focus ring on the track.\nCode:       <label class=\"bl-switch\"><input type=\"checkbox\" role=\"switch\"><span class=\"bl-switch__track\"><\/span><span>Email notifications<\/span><\/label>\n```\n"}, {"name": "Table", "group": "Data display", "height": 326, "width": null, "subtitle": "Sortable header, row header, numeric column and selected row", "readme": "A data table in a rounded, scrollable wrapper, with a caption, a tinted header row, row headers, tabular numerals for numbers and a selected-row state.\n\n```\nComponent:  Table\nPurpose:    Compare records across the same attributes.\nParts:      .bl-table-wrap > table.bl-table > caption + thead > tr > th + tbody > tr > th[scope=row] + td\n            .is-num on numeric cells (right-aligned, tabular figures); th button for sortable headers\nStates:     default, row hover, selected row (aria-selected=\"true\" on the tr)\nRules:      Use a table for 5 or more records with the same attributes; fewer, or rich content per item, use a card list.\n            Numerals with thousands separators, currency with a symbol and two decimals, unambiguous dates (\"14 October 2026\").\n            Every data view needs loading (skeleton), empty (explain and next action) and error (what happened and retry) states.\nResponsive: Mobile: scroll inside a labeled container (role=\"region\" with aria-label and tabindex=\"0\") or turn rows into cards.\n            Tablet: hide low-priority columns. Desktop: all columns.\nA11y:       Use a <caption>, th scope=\"col\" and scope=\"row\", and aria-sort on the sorted column header.\n            Status cells use bl-badge with an icon or word.\nCode:       <div class=\"bl-table-wrap\"><table class=\"bl-table\"><caption>Recent invoices<\/caption>...<\/table><\/div>\n```\n"}, {"name": "Tabs", "group": "Navigation", "height": 120, "width": null, "subtitle": "Underlined tab list with a selected tab", "readme": "A horizontal tab list with a 2px underline on the selected tab, for switching between views of the same content.\n\n```\nComponent:  Tabs\nPurpose:    Switch between sibling views in the same place.\nParts:      .bl-tabs[role=tablist] > button.bl-tab[role=tab][aria-selected] ; panels with role=\"tabpanel\"\nStates:     default, hover, selected (aria-selected=\"true\"), focus\nRules:      Tab labels are in sentence case and name the view. Tab height is 44px, so the target is large enough for touch.\n            The list scrolls horizontally when it does not fit; never hide a tab a person needs.\nA11y:       Set aria-selected on the current tab, link each tab to its panel with aria-controls, and give the list an aria-label.\n            The selected tab is bold with a primary underline, so selection never relies on color alone.\nCode:       <div class=\"bl-tabs\" role=\"tablist\" aria-label=\"Project\"><button class=\"bl-tab\" role=\"tab\" aria-selected=\"true\">Overview<\/button>...<\/div>\n```\n\nState is carried by `aria-selected`, not by a class. `bl-tab.is-hover` exists only for documentation.\n"}, {"name": "Tag", "group": "Data display", "height": 96, "width": null, "subtitle": "User-applied, removable label", "readme": "A 32px label with a strong border and a remove button, for values a person has applied and can take away.\n\n```\nComponent:  Tag\nPurpose:    Show a user-applied label, filter or recipient that can be removed.\nParts:      span.bl-tag > text + button[type=button][aria-label=\"Remove ...\"]\nRules:      Use bl-tag for user-applied, removable labels; use bl-badge for the status of an item.\n            The remove button names what it removes (\"Remove Design\").\nA11y:       The remove button is a native <button> in a 24px target with a hover fill; give it an aria-label.\n            Border is color-border-strong (4.5:1 or more on surface-default).\nCode:       <span class=\"bl-tag\">Design<button type=\"button\" aria-label=\"Remove Design\"><svg class=\"bl-icon bl-icon--sm\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/><\/svg><\/button><\/span>\n```\n"}, {"name": "Templates", "group": "Templates", "height": 340, "width": 1280, "subtitle": "Deck and landing-page layout classes, built from the same tokens", "readme": "Layout classes for a full deck or a landing page \u2014 the kicker-and-rule header, section dividers, the five photo treatments, and the landing sections (hero, principles, stat band, cards, split, quote, steps, footer). Everything here reads existing tokens and `bl-*` classes; nothing redefines one. The only new values are a handful of `--tpl-*` display sizes (`--tpl-text-hero`, `--tpl-text-stat`, `--tpl-text-numeral`, `--tpl-text-lead`, `--tpl-text-quote`) for type larger than the UI ramp goes.\n\n```\nComponent:  Templates\nPurpose:    Build a slide deck or a landing page in Storyloom Design System without leaving the token system.\nClasses:    Deck \u2014 bl-slide, tpl-head/tpl-title/tpl-body/tpl-foot, tpl-divider (section divider),\n            tpl-bullets, tpl-cols, tpl-quad, tpl-table-wrap, tpl-stat, tpl-chart, tpl-frame/tpl-full/tpl-half,\n            tpl-quote, tpl-timeline.\n            Landing \u2014 tpl-nav, tpl-hero-sec/tpl-hero-grid, tpl-principles, tpl-statband, tpl-bleed,\n            tpl-cards, tpl-split, tpl-quote-sec, tpl-steps, tpl-final, tpl-footer.\n            Imagery \u2014 bl-photo-frame, bl-photo, bl-scrim-photo (see the Imagery guideline and the\n            Photography component).\nRules:      Royal blue is the one brand color for emphasis; lavender marks a single highlight per slide, not a whole section.\n            Photography is grayscale only \u2014 see the Imagery guideline before adding a photo.\n            A deck is a fixed 1280x720 artboard (bl-slide inside a scaled tpl-stage); a landing page is\n            fluid at the standard 768px/1024px breakpoints.\nCode:       <section class=\"bl-slide\">\n              <div class=\"tpl-divider\">\n                <p class=\"tpl-numeral\">03<\/p>\n                <h2>Design principles<\/h2>\n              <\/div>\n            <\/section>\n```\n\nA ready-made 21-slide deck (HTML and a native `.pptx`), a landing page, and a worked example of every layout above ship as a separate template pack alongside this system \u2014 ask for it by name if you don't already have a copy. This component and its classes are what let that pack, or a new one, be built and rebuilt from Storyloom Design System's own tokens rather than a one-off stylesheet.\n"}, {"name": "TextField", "group": "Forms", "height": 522, "width": null, "subtitle": "Label, help, input, textarea and error", "readme": "A labelled text control: field wrapper, persistent label, optional help text, single-line input or textarea, and an error line with icon and text.\n\n```\nComponent:  TextField\nPurpose:    Collect free text, an email address, a search term or a longer message.\nParts:      bl-field > label.bl-label + p.bl-help (optional) + input.bl-input | textarea.bl-textarea + p.bl-error (when invalid)\n            bl-input-wrap adds a leading icon and an optional clear button (bl-input-clear)\nStates:     default, hover, focus, disabled, read-only, invalid\nSizes:      Input min-height 40 (44 on touch); textarea min-height 96, resizable vertically. Text is 16px so mobile browsers do not zoom.\nRules:      Every input has a visible, persistent <label>. Placeholders are examples, not labels. Mark optional fields \"(optional)\"\n            (bl-label__opt); never use an asterisk alone. One column. Set type and autocomplete correctly.\n            Validate on blur (format) and on submit (completeness). Do not clear the input after an error.\n            Errors have an icon and text, never color alone.\nA11y:       On submit with errors show an error summary (role=\"alert\"), set aria-invalid=\"true\" and aria-describedby on each invalid input,\n            and move focus to the first invalid field. Focus shows a 2px ring in color-border-focus.\nCode:       <div class=\"bl-field\"><label class=\"bl-label\" for=\"email\">Email address<\/label>\n              <input class=\"bl-input\" id=\"email\" type=\"email\" autocomplete=\"email\"><\/div>\n```\n\nAn invalid input gets a 2px `color-status-error-solid` border. The error text follows the input inside the same `bl-field` and is referenced by `aria-describedby`. Error copy says what happened and how to fix it: \"Enter an email address like name@example.com.\"\n"}, {"name": "Toast", "group": "Feedback", "height": 168, "width": null, "subtitle": "Confirmation of an action, with Undo", "readme": "A dark, elevated message that confirms an action the person just took, with an optional Undo button.\n\n```\nComponent:  Toast\nPurpose:    Confirm an action just taken.\nParts:      .bl-toast > svg.bl-icon + text + button (Undo or Dismiss)\nRules:      Include Undo when the action is reversible. Max width 420px; fill color-surface-inverse, text color-text-inverse,\n            shadow-4; layer it at --z-toast (500). Name the outcome (\"Invoice sent\").\n            Use an alert, not a toast, for a message tied to a place on the page.\nA11y:       Render in a live region (role=\"status\"). Give an icon-only Dismiss button an aria-label.\nCode:       <div class=\"bl-toast\" role=\"status\"><svg class=\"bl-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">...<\/svg>\n              <span>Invoice sent<\/span><button class=\"bl-btn bl-btn--ghost bl-btn--sm\" type=\"button\">Undo<\/button><\/div>\n```\n"}, {"name": "Tooltip", "group": "Feedback", "height": 128, "width": null, "subtitle": "Short inverse hint above its trigger", "readme": "A short inverse-colored hint that appears above its trigger on hover or keyboard focus.\n\n```\nComponent:  Tooltip\nPurpose:    Name or briefly explain a control.\nParts:      span.bl-tooltip-wrap > trigger + span.bl-tooltip[role=tooltip]\nRules:      Keep it to a phrase (max width 240px). Never put essential information, an error or the only label of a control in a tooltip.\n            Fill color-surface-inverse, text color-text-inverse, shadow-2, z-index --z-tooltip (600).\nA11y:       The trigger references the tooltip with aria-describedby. It opens on hover and on focus-within; bl-tooltip.is-open\n            forces it visible for documentation. Icon-only triggers still need their own aria-label.\nCode:       <span class=\"bl-tooltip-wrap\"><button class=\"bl-btn bl-btn--secondary bl-btn--icon\" aria-label=\"Help\" aria-describedby=\"tt\">...<\/button>\n              <span class=\"bl-tooltip\" role=\"tooltip\" id=\"tt\">Archived projects stay searchable<\/span><\/span>\n```\n"}, {"name": "Typography", "group": "Foundations", "height": 728, "width": null, "subtitle": "Display, headings, body, caption, code and links", "readme": "Type utilities that apply the Storyloom Design System scale: display, headings, body sizes, caption, secondary text, inline code, links and the prose measure.\n\n```\nComponent:  Typography\nPurpose:    Apply the type scale to text without inventing sizes.\nClasses:    bl-display | bl-h1 | bl-h2 | bl-h3 | bl-h4 | bl-body-lg | bl-body-sm | bl-caption\n            bl-text-secondary | bl-prose | bl-code | bl-link | bl-body (on <body>)\nRules:      One h1 per page; never skip heading levels. Restyle with .bl-h1 to .bl-h4 instead of picking a heading tag for its size.\n            Headings use Bricolage Grotesque (display family), text Hanken Grotesk (sans), code IBM Plex Mono (mono).\n            Sentence case everywhere. Body text lines stay under 68ch: wrap paragraphs in bl-prose.\n            Secondary text is color-text-secondary; never use color-text-disabled for text people must read.\nResponsive: Display, h1, h2 and h3 shrink below 768px through the font shorthand tokens; nothing else changes.\nA11y:       Links are always underlined and change thickness on hover, so they never rely on color alone. Contrast 4.5:1 or more.\nCode:       <body class=\"bl-body\"><h1 class=\"bl-h1\">Project overview<\/h1><p class=\"bl-prose\">...<\/p><\/body>\n```\n\nSet `class=\"bl-body\"` on `<body>` for the page background, text color and the default `font-body` style. Use `font: var(--font-body); letter-spacing: var(--letter-spacing-body);` when a component needs the same style. `bl-display` is for the marketing hero only.\n"}], "guidelines": [{"file": "10-forms-and-states.md", "title": "Forms and states", "md": "## Forms\n\n- One column. Structure a field as `.bl-field > label.bl-label + (p.bl-help) + input.bl-input + (p.bl-error)`.\n- Mark optional fields \"(optional)\" with `bl-label__opt`; do not use asterisks alone.\n- Validate on blur (format) and on submit (completeness). Do not clear an input after an error.\n- On submit with errors, show an error summary (`role=\"alert\"`), set `aria-invalid=\"true\"` and `aria-describedby` on each invalid input, and move focus to the first invalid field.\n- Set `type` and `autocomplete` correctly. Inputs use at least 16px text on mobile (`--font-body` is 16px).\n- Every error has an icon and text, in `color-status-error-fg`; the invalid input gets a 2px `color-status-error-solid` border.\n\n## Buttons in forms\n\n- One primary button per section. The label is verb plus object (\"Create account\"), never \"Submit\" or \"OK\".\n- Variants: `bl-btn--primary`, `--secondary`, `--tertiary`, `--ghost`, `--destructive`. Sizes: default 40px, `--sm` 32px, `--lg` 48px.\n- Loading: set `aria-busy=\"true\"`, show `bl-spinner bl-spinner--sm`, keep the button width and focus.\n- A lone primary is full width below 768px; a stacked pair is full width too.\n\n## Required states\n\n- Every interactive component has default, hover, focus, active, disabled, loading (if it works asynchronously) and error (if it takes input).\n- Every data view has loading (skeleton), empty (explain and give a next action) and error (what happened and a retry).\n- Express state with `aria-busy`, `aria-invalid`, `aria-disabled`, `aria-selected` and `aria-current`, not with classes alone. The `is-hover`, `is-active` and `is-focus` classes exist only for documentation.\n"}, {"file": "20-responsive-behavior.md", "title": "Responsive behavior", "md": "Design mobile first. Breakpoints: mobile under 768px, tablet 768 to 1023px, desktop 1024px and up. The grid is 4, 8 and 12 columns (`--grid-columns`). Page max 1440px, content container 1200px. Use the literal values 768px, 1024px and 1440px in `@media` rules.\n\n| Element | Mobile | Tablet | Desktop |\n|---|---|---|---|\n| Navigation | menu button with an off-canvas panel, or a bottom nav (max 5) | 72px icon rail | 264px sidebar |\n| Cards | 1 per row | 2 per row | 3 to 4 per row |\n| Tables | scroll in a labeled container, or rows become cards | hide low-priority columns | all columns |\n| Modals | full-width bottom sheet | centered dialog | centered dialog, max 480px |\n| Charts | simplified, legend below, data table available | legend below | full detail |\n| Buttons | lone primary full width, stacked pair full width | natural | natural |\n| Filters | a \"Filters\" button opens a sheet | inline | inline or left panel |\n\n- Multi-column content stacks in reading order below 768px.\n- Never hide the primary action, an error or task-critical information; move it instead.\n- On touch devices (`pointer: coarse`) buttons grow to 44px (small 40, large 52) and inputs to 44px.\n- Test at 320px, 768px and 1280px widths with no horizontal page scroll.\n"}, {"file": "30-ai-features.md", "title": "AI features in the product", "md": "- Label generated content (\"AI-generated\"), using `bl-ai-msg__who` with a badge.\n- Show sources with numbered citations (`bl-cite`, `bl-source`) and say what data was used.\n- Make output editable, rejectable, regenerable and undoable, with a Stop control while the AI is working.\n- Any action that sends, spends, deletes or shares requires a preview and explicit approval, and is recorded in a reviewable history. Show pending approvals in `bl-plan` with a `needs-approval` step.\n- Errors and refusals say what could not be done and what to try.\n- Do not announce streaming text token by token to screen readers; announce start and completion.\n- Components: `bl-prompt` (Prompt), `bl-ai-msg` (AiMessage), `bl-cite` and `bl-source` (in AiMessage), `bl-plan` (Plan), `bl-stream-cursor` (in AiMessage).\n"}, {"file": "40-definition-of-done.md", "title": "Definition of done", "md": "Every generated screen meets all of these before it is finished:\n\n- [ ] Only Storyloom Design System components and tokens; no hex values, no raw px for spacing, radius or type.\n- [ ] Works in light and dark, and at 320px, 768px and 1280px widths without horizontal page scroll.\n- [ ] A keyboard-only walkthrough completes the main task; focus is always visible.\n- [ ] One `h1`; no skipped heading levels; landmarks (`header`, `nav`, `main`).\n- [ ] Loading, empty and error states exist for every data view.\n- [ ] Copy follows the content fundamentals in the README: sentence case, verb plus object on buttons, errors that say what happened and how to fix it.\n\n## Component contract format\n\nEvery component is specified in this shape so it can be reproduced exactly:\n\n```\nComponent:  Button\nPurpose:    Trigger an action within a workflow.\nVariants:   primary | secondary | tertiary | ghost | destructive\nSizes:      sm (32) | md (40, default) | lg (48)\nStates:     default, hover, pressed, focus, disabled, loading\nRules:      One primary per section. Label = verb + object. Loading keeps width, sets aria-busy.\nResponsive: A lone primary is full width below 768px.\nA11y:       Native <button>; 2px focus ring; 4.5:1 label contrast in both themes.\nCode:       <button class=\"bl-btn bl-btn--primary\" type=\"button\">Create account<\/button>\n```\n"}, {"file": "50-imagery.md", "title": "Imagery", "md": "Every photograph in Storyloom Design System prints in pure black and white. Color stays with the interface \u2014 buttons, badges, the accent square \u2014 never the picture.\n\n```html\n<div class=\"bl-photo-frame\" style=\"aspect-ratio: 4 / 3\">\n  <img class=\"bl-photo\" src=\"photo.jpg\" alt=\"Describe what the photo shows and why it's here\">\n<\/div>\n```\n\n- `bl-photo-frame` is the crop container: give it a fixed `aspect-ratio` (or an explicit height) and it clips to `overflow: hidden`.\n- `bl-photo` applies `grayscale(1)` and `object-fit: cover`. It never ships its own color filter, tint or duotone; propose a new class instead of changing this one if a tinted treatment is needed later.\n- Alt text is required. A purely decorative photo (a background behind a scrim, for instance) gets `alt=\"\"` with `role=\"presentation\"` instead of a description, so screen readers skip it.\n\n## Crops\n\nMatch the ratio to the slot; don't stretch or letterbox a photo to a ratio it wasn't shot for \u2014 recrop it instead.\n\n| Ratio | Use |\n|---|---|\n| 16:9 | Full-bleed sections, wide hero photos |\n| 4:3 | Framed images, feature photos |\n| 3:4 | Portrait hero columns |\n| 1:1 | Avatars, small supporting images (`bl-avatar`) |\n\n## The scrim\n\n`bl-scrim-photo` is a gradient overlay for when text sits on top of a photo. It fades from `color-background-default` at the top and bottom to transparent in the middle, so the gradient is always the current theme's ground color, not a fixed black or white wash \u2014 this is what keeps text readable over a photo without leaving the token palette or breaking dark mode.\n\n```html\n<div class=\"bl-photo-frame\">\n  <img class=\"bl-photo\" src=\"photo.jpg\" alt=\"\">\n  <div class=\"bl-scrim-photo\" aria-hidden=\"true\"><\/div>\n<\/div>\n```\n\nOnly use the scrim where text overlaps the photo. A framed or half-bleed image with copy beside it, not on top of it, doesn't need one.\n\n## Rules\n\n- [ ] No color photography, no duotone, no sepia. Grayscale only.\n- [ ] No text directly on a photograph without a scrim behind it, and check the resulting contrast \u2014 a scrim is a gradient, not a guarantee.\n- [ ] Every photo has `alt` text describing its content, or `alt=\"\"` plus `role=\"presentation\"` if it's decorative.\n- [ ] Cropped to one of the four ratios above; the source image is never distorted.\n- [ ] A caption, when present, sits outside the photo frame or in the scrim area \u2014 never as a floating label with no background.\n\nSee the Photography component for a live example, and the Templates component for how the same treatment carries into a full deck or landing page.\n"}, {"file": "60-storytelling.md", "title": "Storytelling", "md": "Rules every CX deck is checked against before the final review.\n\n1. One primary message per slide.\n2. Lead with the insight, not the artifact.\n3. Every claim is backed by evidence on the slide.\n4. Cut slides that exist only to fill a template.\n5. Never repeat the same information on two slides.\n6. Progress: context, understanding, evidence, implication, action.\n7. Use a visual when it communicates faster than text.\n8. Use a chart only when it reveals a meaningful pattern.\n9. No decorative visualizations.\n10. Keep hierarchy, spacing, type and visual language consistent.\n11. Use the same approved representation for the same thing throughout.\n12. Show native experiences with their approved pattern, never a generic placeholder.\n13. Visual design never changes the approved story.\n\nContent hierarchy on every slide: primary message \u2192 supporting evidence \u2192 context \u2192 implication. Never equal visual weight.\n\nStory structures: default CX (context \u2192 problem \u2192 insight \u2192 evidence \u2192 opportunity \u2192 solution \u2192 impact \u2192 action), performance, experiment, concept, journey, and executive answer-first (5 slides or fewer).\n"}, {"file": "70-workflow-and-gates.md", "title": "Workflow and gates", "md": "Never jump from input to slides.\n\n| Step | What happens |\n|---|---|\n| STEP-01 User intent | Owner shares objective, audience, context, data, research, quotes, screenshots. |\n| STEP-02 AI understanding | Why, for whom, what decision, what evidence exists, level of detail. |\n| STEP-03 Story strategy | Pick a presentation type and story structure; draft the Story Proposal. |\n| GATE-01 Story approval | Only an explicit approval unlocks the next step. Silence or partial feedback is not approval. |\n| STEP-04 Presentation blueprint | Map every slide to SLD, CMP, VIZ, DEVICE, MSG and ICN IDs. |\n| GATE-02 Governance exception | Any Restricted or Missing element waits for the owner's approval or a substitute; usually settled here, can open at any step. |\n| STEP-05 Governed assembly | Build the .pptx from approved elements only. |\n| STEP-06 Governance check | Story, design, assets, visualization, content and PowerPoint QC. |\n| GATE-03 Final human review | Owner reviews, edits and signs off. |\n| STEP-07 Final presentation | Deliver the .pptx with the story used, exceptions and gaps. |\n"}, {"file": "80-governance-levels.md", "title": "Governance levels", "md": "Every element carries one status; the badge always shows an icon and a word.\n\n| Level | Rule |\n|---|---|\n| Approved | Use it automatically. |\n| Conditional | Use it only when its stated condition is met. |\n| Restricted | Needs the owner's approval for each use. Proposed drafts start here. |\n| Deprecated | Not used in new presentations (none at present). |\n| Missing | Needed but not in the library: flag it at GATE-02, never improvise it. |\n\nRepresentation hierarchy: reuse an approved asset \u2192 assemble from an approved component \u2192 follow an approved pattern \u2192 adapt the closest approved pattern \u2192 flag the gap.\n"}], "files": ["README.md", "components/Accordion/README.md", "components/Accordion/preview.html", "components/AiMessage/README.md", "components/AiMessage/preview.html", "components/Alert/README.md", "components/Alert/preview.html", "components/Avatar/README.md", "components/Avatar/preview.html", "components/Badge/README.md", "components/Badge/preview.html", "components/Breadcrumb/README.md", "components/Breadcrumb/preview.html", "components/Button/README.md", "components/Button/preview.html", "components/Card/README.md", "components/Card/preview.html", "components/Checkbox/README.md", "components/Checkbox/preview.html", "components/Cover/preview.html", "components/DeviceFrames/README.md", "components/DeviceFrames/preview.html", "components/Dialog/README.md", "components/Dialog/preview.html", "components/Divider/README.md", "components/Divider/preview.html", "components/EmptyState/README.md", "components/EmptyState/preview.html", "components/Header/README.md", "components/Header/preview.html", "components/Icon/README.md", "components/Icon/preview.html", "components/IconTile/README.md", "components/IconTile/preview.html", "components/JourneyMap/README.md", "components/JourneyMap/preview.html", "components/Layout/README.md", "components/Layout/preview.html", "components/Messaging/README.md", "components/Messaging/preview.html", "components/Pagination/README.md", "components/Pagination/preview.html", "components/Photography/README.md", "components/Photography/preview.html", "components/Plan/README.md", "components/Plan/preview.html", "components/PresentationCards/README.md", "components/PresentationCards/preview.html", "components/Progress/README.md", "components/Progress/preview.html", "components/Prompt/README.md", "components/Prompt/preview.html", "components/Radio/README.md", "components/Radio/preview.html", "components/Select/README.md", "components/Select/preview.html", "components/Sidenav/README.md", "components/Sidenav/preview.html", "components/Skeleton/README.md", "components/Skeleton/preview.html", "components/SlideTemplates/README.md", "components/SlideTemplates/preview.html", "components/Spinner/README.md", "components/Spinner/preview.html", "components/Stepper/README.md", "components/Stepper/preview.html", "components/Switch/README.md", "components/Switch/preview.html", "components/Table/README.md", "components/Table/preview.html", "components/Tabs/README.md", "components/Tabs/preview.html", "components/Tag/README.md", "components/Tag/preview.html", "components/Templates/README.md", "components/Templates/preview.html", "components/TextField/README.md", "components/TextField/preview.html", "components/Toast/README.md", "components/Toast/preview.html", "components/Tooltip/README.md", "components/Tooltip/preview.html", "components/Typography/README.md", "components/Typography/preview.html", "components/bundle.css", "components/bundle.js", "components/index.d.ts", "design-system.json", "guidelines/10-forms-and-states.md", "guidelines/20-responsive-behavior.md", "guidelines/30-ai-features.md", "guidelines/40-definition-of-done.md", "guidelines/50-imagery.md", "guidelines/60-storytelling.md", "guidelines/70-workflow-and-gates.md", "guidelines/80-governance-levels.md", "tokens.css", "tokens.json"]}</script>
<script>
(function () {

        <p class="cx-muted bl-body-sm" style="margin-top:var(--space-4)">START_HERE.md in the zip also has build notes for Claude (canvas, fonts, colors, slide conventions). Claude reads those itself; you don't need to do anything with them.</p>`);

  PAGES.download = () => {
    const tree = `Storyloom_AI_Starter_v0.2/\n├── START_HERE.md          ← open first: using it with Claude, copy-paste prompts\n├── README.md\n├── ai-upload-pack/        ← the 3 files to upload to a Claude chat or Project\n├── spec/\n│   ├── storyloom-ai-presentation.md\n│   └── storyloom-ai-registry.json\n├── templates/             ← 7 template decks (built when you download)\n├── icons/                 ← ${R.icons.items.length} icons × rounded, rounded-solid, outline · SVG + PNG\n├── tools/                 ← cxdeck.js, the generator behind the templates\n├── tokens/\n│   ├── tokens.css\n│   └── bundle.css\n├── device-frames/\n│   ├── A-DEV-IPHONE-01 … A-DEV-BROWSER-01 (6 approved PNGs)\n│   └── proposed-drafts/  DESKTOP-01 (Restricted)\n└── examples/\n    └── slides/            ← Cologuard reference deck (11 × 1280×720 JPG)`;
    const frames = Object.entries(FR).map(([k, f]) => ({ path: "files/frames/" + f.file, name: f.file, size: `${f.px[0]} × ${f.px[1]} px`, icon: "image", desc: /DRAFT/.test(f.file) ? "Proposed draft · Restricted" : "Approved frame", k }));
    const row = f => `<div class="cx-file"><span class="cx-ico">${ico(f.icon)}</span><div><b>${esc(f.name)}</b><small>${esc(f.desc)} · ${esc(f.size)}</small></div>${dlBtn(f)}</div>`;
    return pageHead("download", "One zip with everything Claude needs to build a governed CX deck: a START_HERE guide with copy-paste prompts, the spec and registry, template decks, the full icon set, device frames, tokens and a reference deck.") +
      `<div class="cx-pkg"><div class="cx-card"><div class="cx-crumb">${ico("package")} Starter package · v${esc(R.meta.version)}</div><h2 class="bl-h3">Storyloom_AI_Starter_v0.2.zip</h2><p class="cx-muted">About 760 files, packed in your browser when you click (takes a few seconds). Open START_HERE.md first.</p></div>${dlBtn(FILES[0], "Download .zip", "bl-btn--primary bl-btn--lg")}</div>
      <p class="cx-muted bl-body-sm" id="dlNote">Your browser asks you to confirm each download.</p>` +
      sec("start", "Start in five steps", `<ol class="cx-steps">
        <li><div><b>Give Claude the spec</b><span>Upload the three files in ai-upload-pack/ to a chat, or add them to a Claude Project. START_HERE.md has the prompts to paste.</span></div></li>
        <li><div><b>Share your intent</b><span>Objective, audience, context and whatever data, research, quotes and screenshots you have (STEP-01).</span></div></li>
        <li><div><b>Approve the story</b><span>The AI returns a Story Proposal first. Only an explicit approval unlocks the build (GATE-01).</span></div></li>
