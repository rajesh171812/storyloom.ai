<style>
  /* Page layout for the documentation site. Values come from Storyloom Design System tokens only. */
  [hidden] { display: none !important; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: calc(56px + var(--space-6)); }
  body { background: var(--color-background-default); color: var(--color-text-primary); font: var(--font-body); margin: 0; -webkit-font-smoothing: antialiased; }
  a { color: var(--color-text-link); }
  .cx-skip { position: absolute; left: var(--space-4); top: -100px; z-index: var(--z-tooltip); }
  .cx-skip:focus { top: var(--space-2); }

  /* Header */
  .cx-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-sticky); gap: var(--space-3); padding-inline: var(--space-4); }
  .cx-brand { display: flex; align-items: baseline; gap: var(--space-2); text-decoration: none; color: var(--color-text-primary); white-space: nowrap; }
  .cx-brand b { font: var(--font-h4); font-size: 1.125rem; letter-spacing: var(--letter-spacing-h3); }
  .cx-brand span { font: var(--font-caption); color: var(--color-text-secondary); }
  .cx-search { position: relative; flex: 1; max-width: 440px; margin-inline: auto; }
  .cx-search .bl-input { min-height: 36px; background: var(--color-surface-sunken); }
  .cx-kbd { position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%); font: var(--font-code); font-size: 0.75rem; color: var(--color-text-secondary); border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-sm); padding: 0 var(--space-1); background: var(--color-surface-default); pointer-events: none; }
  .cx-results { position: absolute; left: 0; right: 0; top: calc(100% + var(--space-1)); background: var(--color-surface-elevated); border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-2); z-index: var(--z-dropdown); padding: var(--space-1); max-height: 60vh; overflow: auto; }
  .cx-results a { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); text-decoration: none; color: var(--color-text-primary); font: var(--font-body-sm); }
  .cx-results a:hover, .cx-results a[aria-selected="true"] { background: var(--color-state-hover); }
  .cx-results code { font: var(--font-code); color: var(--color-text-secondary); }
  .cx-results small { font: var(--font-caption); color: var(--color-text-secondary); }
  .cx-results p { margin: 0; padding: var(--space-3); font: var(--font-body-sm); color: var(--color-text-secondary); }
  .cx-menu-btn { display: none; }
  .cx-hide-sm { display: inline-flex; }

  /* Shell */
  .cx-shell { display: grid; grid-template-columns: var(--layout-sidebar-width) minmax(0, 1fr); max-width: var(--layout-page-max); margin-inline: auto; }
  .cx-side { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); height: calc(100vh - 56px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: var(--space-4) var(--space-3) var(--space-8); border-right: var(--border-width-1) solid var(--color-border-default); background: var(--color-background-default); }
  .cx-side .bl-sidenav__group { text-transform: uppercase; letter-spacing: 0.06em; }
  .cx-side .bl-sidenav a { min-height: 36px; }
  .cx-side .bl-sidenav a .cx-count { margin-left: auto; font: var(--font-caption); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
  .cx-main-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 208px; gap: var(--space-8); padding: var(--space-8) var(--space-8) var(--space-11); }
  main { min-width: 0; max-width: 960px; }
  .cx-toc { position: sticky; top: calc(56px + var(--space-8)); align-self: start; font: var(--font-body-sm); }
  .cx-toc p { margin: 0 0 var(--space-2); font: var(--font-caption); font-weight: var(--font-weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
  .cx-toc ol { list-style: none; margin: 0; padding: 0; border-left: var(--border-width-1) solid var(--color-border-default); display: grid; }
  .cx-toc a { display: block; padding: var(--space-1) var(--space-3); margin-left: -1px; border-left: var(--border-width-2) solid transparent; color: var(--color-text-secondary); text-decoration: none; }
  .cx-toc a:hover { color: var(--color-text-primary); }
  .cx-toc a[aria-current="true"] { color: var(--color-text-primary); border-left-color: var(--color-action-primary-bg); font-weight: var(--font-weight-semibold); }

  /* Page furniture */
  .cx-page { display: grid; gap: var(--space-9); }
  .cx-page[hidden] { display: none; }
  .cx-page > *, section > *, .cx-pkg > *, .cx-card > * { min-width: 0; }
  code, .bl-code { overflow-wrap: anywhere; }
  .cx-pkg h2 { overflow-wrap: anywhere; }
  .cx-page > *, section > *, .cx-pkg > *, .cx-card > * { min-width: 0; }
  code, .bl-code { overflow-wrap: anywhere; }
  .cx-pkg h2 { overflow-wrap: anywhere; }
  .cx-head { display: grid; gap: var(--space-3); }
  .cx-crumb { font: var(--font-label); color: var(--color-text-secondary); display: flex; gap: var(--space-2); align-items: center; }
  .cx-lead { font: var(--font-body-lg); color: var(--color-text-secondary); margin: 0; max-width: var(--layout-prose-max); }
  .cx-hero { border-radius: var(--radius-xl); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); overflow: hidden; }
  section { display: grid; gap: var(--space-5); scroll-margin-top: calc(56px + var(--space-6)); }
  section > h2 { margin: 0; }
  section > p, .cx-p { margin: 0; max-width: var(--layout-prose-max); }
  .cx-muted { color: var(--color-text-secondary); }
  .cx-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .cx-grid--2 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  .cx-grid--3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .cx-card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
  .cx-card h3, .cx-card h4 { margin: 0; }
  .cx-card { display: grid; gap: var(--space-3); align-content: start; }
  .cx-card p { margin: 0; }
  .cx-id { display: inline-flex; align-items: center; gap: var(--space-1); font: var(--font-code); color: var(--color-text-secondary); }
  .cx-id button { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
  .cx-id button:hover { background: var(--color-state-hover); color: var(--color-text-primary); }
  @media (pointer: coarse) { .cx-id button { width: 44px; height: 44px; } }
  .cx-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .cx-chip { font: var(--font-code); font-size: 0.75rem; padding: 0 var(--space-2); border-radius: var(--radius-sm); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); color: var(--color-text-primary); text-decoration: none; line-height: 1.5rem; white-space: nowrap; }
  a.cx-chip:hover { border-color: var(--color-border-strong); }
  .bl-badge--neutral { background: var(--color-surface-sunken); color: var(--color-text-secondary); border-color: var(--color-border-default); }
  .cx-flash { animation: cx-flash 1.6s var(--easing-standard); }
  @keyframes cx-flash { 0%, 40% { box-shadow: 0 0 0 3px var(--color-border-focus); } 100% { box-shadow: 0 0 0 0 transparent; } }
  tr.cx-flash td, tr.cx-flash th { background: var(--color-state-selected-bg); }
  .cx-table td, .cx-table th { vertical-align: top; }
  .cx-table td:first-child { white-space: nowrap; }
  .cx-table .cx-id { white-space: nowrap; }
  .cx-mini { width: 132px; min-width: 132px; display: block; }
  .cx-table td.cx-prev { width: 148px; padding-right: var(--space-2); }
  .cx-wf .dv1 { fill: var(--color-dataviz-1); }
  tr.cx-dep td { opacity: .72; }

  /* Overview */
  .cx-hero-home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-6); align-items: center; padding: var(--space-8); background: var(--color-surface-default); }
  .cx-hero-home .bl-display { font-size: clamp(2rem, 3vw, 2.75rem); line-height: 1.1; }
  .cx-collage { position: relative; aspect-ratio: 4 / 3; }
  .cx-collage img { position: absolute; width: 78%; border-radius: var(--radius-md); box-shadow: var(--shadow-2); border: var(--border-width-1) solid var(--color-border-default); }
  .cx-collage img:nth-child(1) { left: 0; top: 0; }
  .cx-collage img:nth-child(2) { right: 0; top: 30%; }
  .cx-collage img:nth-child(3) { left: 8%; bottom: 0; width: 58%; }
  .cx-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }
  .cx-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-lg); background: var(--color-surface-default); overflow: hidden; }
  .cx-stats div { padding: var(--space-4) var(--space-5); border-right: var(--border-width-1) solid var(--color-border-default); }
  .cx-stats div:last-child { border-right: 0; }
  .cx-stats b { display: block; font: var(--font-h2); font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
  .cx-stats span { font: var(--font-body-sm); color: var(--color-text-secondary); }
  .cx-tile { text-decoration: none; color: inherit; }
  .cx-tile .cx-ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--color-state-selected-bg); color: var(--color-action-secondary-text); }
  .cx-tile p { color: var(--color-text-secondary); font: var(--font-body-sm); }
  .cx-tile .cx-go { display: inline-flex; gap: var(--space-1); align-items: center; font: var(--font-label); color: var(--color-text-link); }

  /* Workflow */
  .cx-flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .cx-flow li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--space-4); position: relative; padding-bottom: var(--space-5); }
  .cx-flow li::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--color-border-default); }
  .cx-flow li:last-child::before { display: none; }
  .cx-dot { width: 40px; height: 40px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--color-surface-default); border: var(--border-width-2) solid var(--color-action-primary-bg); color: var(--color-action-secondary-text); font: var(--font-label); font-weight: var(--font-weight-bold); z-index: 1; }
  .cx-flow li.is-gate .cx-dot { background: var(--color-status-warning-bg); border-color: var(--color-status-warning-solid); color: var(--color-status-warning-fg); }
  .cx-flow h3 { margin: var(--space-2) 0 var(--space-1); font: var(--font-h4); display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
  .cx-flow li.is-any .cx-dot { border-style: dashed; }
  .cx-flow li.is-any > div { padding: var(--space-3) var(--space-4); margin-left: calc(var(--space-2) * -1); border-radius: var(--radius-md); background: var(--color-status-warning-bg); border: var(--border-width-1) dashed var(--color-status-warning-border); }
  .cx-flow li.is-any h3 { margin-top: 0; }
  .cx-flow p { margin: 0; color: var(--color-text-secondary); max-width: var(--layout-prose-max); }
  .cx-pre { position: relative; }
  .cx-tree { white-space: pre-wrap; }
  .cx-pre pre { margin: 0; padding: var(--space-5); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-lg); font: var(--font-code); overflow-x: auto; color: var(--color-text-primary); }
  .cx-pre .bl-btn { position: absolute; top: var(--space-2); right: var(--space-2); background: var(--color-surface-default); }
  .cx-note { display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-radius: var(--radius-md); background: var(--color-status-info-bg); color: var(--color-status-info-fg); border: var(--border-width-1) solid var(--color-status-info-border); }
  .cx-note--warn { background: var(--color-status-warning-bg); color: var(--color-status-warning-fg); border-color: var(--color-status-warning-border); }
  .cx-note p { margin: 0; color: var(--color-text-primary); }
  .cx-note b { color: inherit; }

  /* Sequences and story flow */
  .cx-seq { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); counter-reset: s; }
  .cx-seq li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) 0; border-bottom: var(--border-width-1) solid var(--color-border-default); font: var(--font-body-sm); }
  .cx-seq li:last-child { border-bottom: 0; }
  .cx-seq li::before { counter-increment: s; content: counter(s, decimal-leading-zero); font: var(--font-code); color: var(--color-text-secondary); }
  .cx-arrows { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .cx-arrows span { padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); font: var(--font-label); }
  .cx-arrows .bl-icon { color: var(--color-text-secondary); }

  /* Slide templates */
  .cx-wf { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: var(--radius-md); border: var(--border-width-1) solid var(--color-border-default); background: var(--color-background-default); }
  .cx-wf .g { fill: var(--color-background-default); } .cx-wf .s { fill: var(--color-surface-default); stroke: var(--color-border-default); stroke-width: .4; }
  .cx-wf .t { fill: var(--color-text-primary); } .cx-wf .m { fill: var(--color-border-strong); opacity: .55; } .cx-wf .l { fill: var(--color-border-default); }
  .cx-wf .p { fill: var(--color-action-primary-bg); } .cx-wf .pl { fill: var(--color-action-primary-text); opacity: .8; } .cx-wf .a { fill: var(--color-accent-bg); }
  .cx-wf .k { fill: var(--color-surface-inverse); } .cx-wf .kl { fill: var(--color-text-inverse); opacity: .7; }
  .cx-wf .e { fill: var(--color-status-error-bg); } .cx-wf .ok { fill: var(--color-status-success-bg); }
  .cx-wf .ln { fill: none; stroke: var(--color-action-primary-bg); stroke-width: .9; } .cx-wf .ax { fill: none; stroke: var(--color-border-strong); stroke-width: .5; }
  .cx-wf .dv2 { fill: var(--color-dataviz-2); } .cx-wf .dv3 { fill: var(--color-dataviz-3); } .cx-wf .dv4 { fill: var(--color-dataviz-4); }
  .cx-wf .ph { fill: var(--color-surface-default); stroke: var(--color-text-primary); stroke-width: 1.2; } .cx-wf .phs { fill: var(--color-surface-sunken); }
  .cx-media { position: relative; }
  .cx-media img { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-md); border: var(--border-width-1) solid var(--color-border-default); }
  .cx-seg { display: inline-flex; padding: 2px; border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--border-width-1) solid var(--color-border-default); }
  .cx-seg button { border: 0; background: transparent; font: var(--font-label); color: var(--color-text-secondary); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); cursor: pointer; min-height: 32px; }
  .cx-seg button[aria-pressed="true"] { background: var(--color-surface-default); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
  .cx-filter { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .cx-filter button { border: var(--border-width-1) solid var(--color-border-default); background: var(--color-surface-default); border-radius: var(--radius-full); padding: 0 var(--space-3); min-height: 32px; font: var(--font-label); color: var(--color-text-primary); cursor: pointer; }
  .cx-filter button[aria-pressed="true"] { background: var(--color-state-selected-bg); border-color: var(--color-state-selected-border); font-weight: var(--font-weight-semibold); }
  .cx-dep { opacity: .72; }
  .cx-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-3); font: var(--font-body-sm); margin: 0; }
  .cx-meta dt { color: var(--color-text-secondary); } .cx-meta dd { margin: 0; }

  /* Template decks */
  .cx-tpl { display: grid; gap: var(--space-4); padding-top: var(--space-5); border-top: var(--border-width-1) solid var(--color-border-default); }
  .cx-tpl > *, [data-tpl-body] > * { min-width: 0; }
  [data-tpl-body] { display: grid; gap: var(--space-3); }
  .cx-tpl > *, [data-tpl-body] > * { min-width: 0; }
  [data-tpl-body] { display: grid; gap: var(--space-3); }
  .cx-tpl-main img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: var(--radius-md); border: var(--border-width-1) solid var(--color-border-default); box-shadow: var(--shadow-1); }
  .cx-thumbs { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-1) 2px var(--space-2); scroll-snap-type: x proximity; }
  .cx-thumbs button { flex: 0 0 auto; width: 132px; display: grid; gap: var(--space-1); padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left; scroll-snap-align: start; color: var(--color-text-secondary); font: var(--font-caption); }
  .cx-thumbs img { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); border: var(--border-width-2) solid var(--color-border-default); display: block; }
  .cx-thumbs button[aria-current="true"] img { border-color: var(--color-action-primary-bg); }
  .cx-thumbs button[aria-current="true"] { color: var(--color-text-primary); font-weight: var(--font-weight-semibold); }
  .cx-thumbs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cx-cap { display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; font: var(--font-body-sm); color: var(--color-text-secondary); }
  .cx-cap b { color: var(--color-text-primary); font-weight: var(--font-weight-semibold); }

  /* Devices */
  .cx-stage { display: grid; place-items: center; padding: var(--space-6); background: var(--color-surface-sunken); border-radius: var(--radius-md); min-height: 260px; }
  .cx-frame { position: relative; display: inline-block; line-height: 0; }
  .cx-frame img { max-height: 240px; width: auto; max-width: 100%; }
  .cx-frame .cx-area { position: absolute; border: var(--border-width-2) dashed var(--color-status-info-solid); background: color-mix(in srgb, var(--color-status-info-bg) 70%, transparent); border-radius: var(--radius-sm); display: grid; place-items: center; font: var(--font-caption); color: var(--color-status-info-fg); line-height: 1.2; text-align: center; padding: var(--space-1); }
  .cx-area { display: none !important; } .cx-show-areas .cx-area { display: grid !important; }
  .cx-missing { display: grid; place-items: center; min-height: 260px; border: var(--border-width-2) dashed var(--color-border-strong); border-radius: var(--radius-md); color: var(--color-text-secondary); text-align: center; padding: var(--space-5); font: var(--font-body-sm); gap: var(--space-2); }
  .cx-lineup { display: flex; align-items: flex-end; justify-content: center; gap: var(--space-6); padding: var(--space-8) var(--space-6) var(--space-6); flex-wrap: wrap; }
  .cx-lineup img { height: auto; }
  .cx-toolbar { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .bl-switch-row { display: inline-flex; align-items: center; gap: var(--space-2); font: var(--font-label); cursor: pointer; }

  /* Messaging drafts: native platform colors are allowed inside MSG-* only (CX system rule). */
  .cx-msg { --msg-blue: #0a84ff; --msg-green: #34c759; --msg-grey: #e9e9eb; --msg-ink: #111111; --msg-bg: #ffffff; }
  .cx-phone { position: relative; width: 200px; max-width: 100%; }
  .cx-phone img { width: 100%; height: auto; position: relative; z-index: 1; display: block; }
  .cx-phone .scr { position: absolute; z-index: 0; background: var(--msg-bg); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; gap: 5px; padding: 30px 10px 10px; font-family: system-ui, -apple-system, sans-serif; font-size: 9px; line-height: 1.3; color: var(--msg-ink); }
  .cx-phone .hd { text-align: center; font-size: 8px; color: #6e6e73; margin-bottom: 4px; }
  .cx-phone .hd b { display: block; color: var(--msg-ink); font-size: 9px; }

<script type="application/json" id="dsdata">{"name": "Storyloom Design System", "url": "https://claude.ai/artifact/Gd9aY9sWY38VvycHZaC3ki", "readme": "The design system behind **Storyloom AI** (*Your story. Structured. Designed. Presented.*): the Storyloom brand palette on a proven token and `bl-` component structure (inherited from Baseline), plus presentation components (slide templates, KPI, insight and quote cards, journey map, device frames, messaging, rounded icons) and the storytelling and governance rules an AI must follow when it builds a deck. The class prefix stays `bl-` so existing Baseline markup keeps working; only the tokens differ.\n\n## Hard rules\n\n1. **Use existing components.** Never invent a new button, input, card, alert, badge or table style when one exists. If none fits, say so and propose an addition instead of improvising a one-off. Combobox, date picker, file upload, menu/dropdown and drawer are specified but not built.\n2. **Use tokens, never raw values.** No hex or rgb colors, no px spacing, font sizes, radii, shadows, durations or z-indexes in product code. Use the CSS variables, and the **semantic** color tokens (`--color-text-primary`), never the primitives (`--color-neutral-900`).\n3. **Every interactive element** has a visible focus state, an accessible name and a 44px touch target on touch devices. Prefer native HTML over ARIA.\n4. **Never rely on color alone.** Errors have an icon and text, selected items an outline or check, status badges an icon or a word.\n5. **Every input has a visible, persistent `<label>`.** Placeholders are examples, not labels.\n6. **Support light and dark** by using semantic tokens only. Never add a theme-specific color inline.\n7. **Respect `prefers-reduced-motion`.** Animate only state changes the person caused, using the duration and easing tokens.\n8. **When unsure, ask or take the more conservative existing pattern, and state your assumption.** Do not silently invent components, tokens or copy conventions.\n\n## Setup\n\nLoad `tokens.css`, then the component stylesheet (`bundle.css`), and set `class=\"bl-body\"` on `<body>`. Load the three Google fonts (Bricolage Grotesque, Hanken Grotesk, IBM Plex Mono) or replace them by changing `--font-family-*`. Light is the default theme; set `data-theme=\"dark\"` on `<html>` for dark. Token names read `category-role-property-state` in CSS (`--color-action-primary-bg-hover`).\n\n## Content fundamentals\n\n- Sentence case everywhere: headings, buttons, tabs, labels. Buttons name the outcome: verb plus object (\"Create account\", \"Send invoice\"), never \"Submit\" or \"OK\".\n- Use one word for one thing throughout (\"project\", \"sign in\"; \"delete\" means permanent, \"remove\" means detach).\n- Errors say what happened and how to fix it, without apologizing or blaming. Not \"Something went wrong.\" but \"We couldn't save your changes. Check your connection and try again.\"\n- Empty states say what this is, why it is empty and offer one action: \"No invoices yet. Invoices you send will appear here.\" with a Create invoice button.\n- Confirmation dialogs: the title is action plus object (\"Delete project?\"), the body is the consequence, the buttons repeat the verb (\"Delete project\" / \"Keep project\").\n- Numerals for quantities with thousands separators, currency with a symbol and two decimals ($1,240.00), unambiguous dates (\"14 October 2026\"). Mark optional fields \"(optional)\", never an asterisk alone.\n- Regulated language (health, legal, financial): do not invent it; use the terms supplied by the responsible specialist.\n\n## Color\n\n- Text is `color-text-primary` by default, `color-text-secondary` for help text, captions and placeholders, `color-text-link` for links (always underlined). `color-text-disabled` is for disabled controls only, and is below 4.5:1 by design.\n- Grounds: `color-background-default` for the page, `color-surface-default` for cards, inputs and tables, `color-surface-elevated` for dialogs, `color-surface-sunken` for recessed areas (code chips, table headers), `color-surface-inverse` with `color-text-inverse` for toasts and tooltips.\n- Borders: `color-border-default` separates (decorative), `color-border-strong` bounds controls, `color-border-focus` draws the 2px focus ring.\n- Brand: **Royal blue** `#2E4AED` (`primary-500`) is the action color: primary buttons, links, selected state and emphasis numbers (6.3:1 on white). **Deep navy** `#000075` (`primary-900`) is the ground for title and section slides, the inverse surface and dark panels. **Pale lavender** `#D6DBFC` (`color-accent-bg` with `color-accent-text` navy) is the one highlight per slide and the light card tint. **Periwinkle** `#97A3F5` (`primary-300`) is a card background and the dark-mode action color; text on it is always navy, never white (2.4:1).\n- Focus: the ring is `#0D19FB` on light grounds (7.5:1). On navy it would vanish (2.0:1), so dark surfaces use pale lavender.\n- Semantic mapping: primary action = `primary.500` in light and `primary.300` (Periwinkle) in dark. Change a brand color by changing primitive steps, not by re-pointing semantic tokens.\n- Neutrals: Charcoal `#222731` text, Dark Gray `#63666A` secondary text, Medium Gray `#888B8D` control borders, Light Gray `#D9D9D6` dividers, white cards. Page ground `#F4F4F2` and sunken `#ECECEA` are derived tints.\n- Status: use the four sets `color-status-{success,warning,error,info}-{fg,bg,border,solid}`. `fg` is text on `bg`; `solid` is an icon or marker at 3:1 or more; always pair with an icon and a word. Markers: green `#00B140`, orange `#FF6900`, red `#E4002B`, royal blue; text shades `#007A2C`, `#A84600` and `#B00021` keep text at 4.5:1 or more.\n- Charts: use `color-dataviz-1` to `color-dataviz-6` in order (Royal blue, Deep navy, Coral, Magenta, Green, Periwinkle; lighter versions in dark), and also tell series apart by label, shape or pattern. The brand blues are one hue family, so series 3 onward switch hue; series 5 and 6 sit near 3:1 on white, so always direct-label them.\n- Selection and hover: `color-state-hover`, `color-state-active`, `color-state-selected-bg` with `color-state-selected-border`, and the `color-state-disabled-*` pair.\n\n## Typography\n\nHeadings use Bricolage Grotesque (`--font-family-display`), everything else Hanken Grotesk (`--font-family-sans`), code IBM Plex Mono (`--font-family-mono`). Apply a style with `font: var(--font-body); letter-spacing: var(--letter-spacing-body);`, or with the `bl-*` classes.\n\n| Token | Size / line | Weight | Use |\n|---|---|---|---|\n| `--font-display` | 56 / 60 | 700 | Marketing hero, one per page |\n| `--font-h1` | 40 / 48 | 700 | Page title, one per page |\n| `--font-h2` | 32 / 40 | 600 | Major section |\n| `--font-h3` | 24 / 32 | 600 | Sub-section, card title, dialog title |\n| `--font-h4` | 20 / 28 | 600 | Group heading, small card title |\n| `--font-body-lg` | 18 / 28 | 400 | Lead paragraph |\n| `--font-body` | 16 / 24 | 400 | Default text, paragraphs, table cells |\n| `--font-body-sm` | 14 / 20 | 400 | Secondary text, help text, dense UI |\n| `--font-label` | 14 / 20 | 500 | Form labels, tabs, nav items |\n| `--font-caption` | 12 / 16 | 400 | Timestamps, metadata, chart axis text |\n| `--font-button` | 14 / 20 | 600 | Button labels (large button 16 / 24) |\n| `--font-code` | 13 / 20 | 400 | Inline code, token names, code blocks |\n\nOne `h1` per page and no skipped heading levels: restyle with `bl-h1` to `bl-h4` instead. Body lines stay under 68ch (`--layout-prose-max`). Display, h1, h2 and h3 shrink below 768px.\n\n## Spacing, layout and shape\n\n- Spacing is a 4px scale (`--space-1` 4px to `--space-11` 96px). Use `--space-3` to `--space-5` for component padding, `--space-2` for icon gaps, `--space-4` between form fields, `--space-5` for card padding and `--space-8` to `--space-10` between page sections.\n- Page margin and grid: 16px and 4 columns on mobile, 24px and 8 columns on tablet, 32px and 12 columns on desktop (`--grid-margin`, `--grid-columns`). Page max 1440px, content container 1200px.\n- Radius: `--radius-sm` 4 (checkboxes, code chips), `--radius-md` 8 (buttons, inputs, alerts), `--radius-lg` 12 (cards), `--radius-xl` 16 (dialogs), `--radius-full` (avatars, pills, badges).\n- Borders: `--border-width-1` for dividers and outlines, `--border-width-2` for the focus ring, selected and error states.\n- Elevation: `--shadow-1` card, `--shadow-2` dropdown and popover, `--shadow-3` modal, `--shadow-4` toast. Never stack shadows: a card inside a card is `bl-card--flat`.\n- Layers: `--z-sticky` 100, `--z-dropdown` 200, `--z-overlay` 300, `--z-modal` 400, `--z-toast` 500, `--z-tooltip` 600.\n- Motion: `--duration-fast` 120ms for hover and toggles, `--duration-normal` 240ms for menus and accordions, `--duration-slow` 400ms for dialogs and progress; `--easing-standard` by default, `--easing-enter` and `--easing-exit` for arrivals and departures.\n\n## Iconography\n\nIcons are Lucide outline icons, inlined as SVG with `viewBox=\"0 0 24 24\"`, stroked with `currentColor` at `--icon-stroke` (1.75). Sizes: `--icon-xs` 12, `--icon-sm` 16, `--icon-md` 20 (default), `--icon-lg` 24, `--icon-xl` 32, applied with the `bl-icon` class and its size modifiers. Icons never carry meaning alone. No logo or brand mark ships with this system: set the product name in plain type until one is supplied.\n\n## Photography\n\nPhotography prints in pure black and white; color stays with the interface, never the picture. `bl-photo-frame` crops (fixed `aspect-ratio` or height, `overflow: hidden`); `bl-photo` on the `<img>` applies the grayscale and the crop; `bl-scrim-photo` is a theme-following gradient for the rare case where text sits on top of a photo. Crop to 16:9, 4:3, 3:4 or 1:1 and never distort the source. Full rules, including alt text and captions, are in the Imagery guideline and the Photography component.\n\nThe same tokens extend to a full slide deck or a landing page through the Templates component (`tpl-*` classes) \u2014 a section-divider pattern, bulleted and columned slides, charts, five photo treatments, and a landing page's hero, stat band, card grid and footer, all reading this system's existing colors, type and spacing rather than a one-off stylesheet.\n\n## Brand palette\n\n| Brand color | Hex | Token | Role |\n|---|---|---|---|\n| Deep navy | `#000075` | `primary-900` \u2192 `surface-inverse`, `dataviz-2` | Title and section slides, dark panels |\n| Royal blue | `#2E4AED` | `primary-500` \u2192 `action-primary-bg`, `text-link`, `dataviz-1` | Buttons, links, emphasis, large feature cards |\n| Periwinkle | `#97A3F5` | `primary-300` | Card backgrounds, dark-mode action (navy text only) |\n| Pale lavender | `#D6DBFC` | `primary-100`, `accent-500` \u2192 `accent-bg` | One highlight per slide, light card tint, text on navy |\n| Focus blue | `#0D19FB` | `border-focus` (light) | Keyboard focus ring on light grounds |\n| White | `#FFFFFF` | `neutral-0` | Text on navy and royal blue, cards |\n| Charcoal | `#222731` | `neutral-900` \u2192 `text-primary` | Body text |\n| Dark Gray | `#63666A` | `neutral-600` \u2192 `text-secondary` | Secondary text |\n| Medium Gray / Light Gray | `#888B8D` / `#D9D9D6` | `neutral-500` / `neutral-200` | Control borders / dividers |\n| Green / Orange / Red | `#00B140` / `#FF6900` / `#E4002B` | `status-*-solid` | Status markers |\n| Coral / Magenta | `#E56A54` / `#AA0061` | `dataviz-3`, `dataviz-4` | Chart series |\n\n## Presentation layer\n\nThese components and guidelines turn the tokens into Storyloom decks. A deck is 16:9, 1280 \u00d7 720 design canvas (13.333 \u00d7 7.5 in); slide type sizes are canvas pixels (\u00d7 0.75 for PowerPoint points).\n\n- **SlideTemplates**: the governed slide layouts (`SLD-*` IDs) with wireframes.\n- **PresentationCards**: KPI, metric, insight, evidence, quote and customer cards (`CMP-*`).\n- **JourneyMap**: stages across; actions, feelings, pain points or changes down.\n- **DeviceFrames**: transparent iPhone, iPad, MacBook and browser frames with measured screen areas (asset group *Device frames*).\n- **Messaging**: SMS, RCS, iMessage and lock-screen drafts. Restricted: each use needs the owner's approval.\n- **IconTile**: the three icon variants. **Rounded (`ICN-*-RD`) is the default on slides**; outline is for icons inside pills, badges and tables.\n- Guidelines: *Storytelling* (13 rules), *Workflow and gates* (STEP-01 to STEP-07, GATE-01 to GATE-03), *Governance levels*.\n\nThe full registry of IDs, statuses and slide sequences lives in the project's `storyloom-ai-presentation.md` spec; this system is its visual foundation.\n\n## Component selection\n\n| Need | Use |\n|---|---|\n| A photograph in product UI, a slide or a page | `bl-photo-frame` + `bl-photo` (Photography) |\n| A slide deck or a landing page | `tpl-*` layout classes (Templates) |\n| Compare 5+ records across the same attributes | `bl-table` (Table) |\n| Fewer than 5 records, or rich content per item | `bl-card` list (Card) |\n| Choose 1 of 2 to 5 options | radio group in a `bl-fieldset` (Radio) |\n| Choose 1 of many | `bl-select` (Select); a combobox if searchable (not built) |\n| On/off that applies immediately | `bl-switch` (Switch) |\n| On/off that needs a Save button | `bl-check` (Checkbox) |\n| Message tied to a place on the page | `bl-alert` (Alert) |\n| Confirmation of an action just taken | `bl-toast` (Toast), with Undo if reversible |\n| Irreversible action | `dialog.bl-dialog` confirmation (Dialog) |\n| Page-wide or account-wide state | `bl-alert bl-alert--banner` |\n| Wait, unknown length, short | `bl-spinner` with a text label (Spinner) |\n| Wait, content layout known | `bl-skeleton` (Skeleton) |\n| Wait, known length | `bl-progress` (Progress) |\n| Status of an item | `bl-badge` with an icon or word (Badge) |\n| User-applied, removable label | `bl-tag` (Tag) |\n\nRead a component's guideline before using it: each states its variants, sizes, states, rules, responsive behavior, accessibility and a code sample. Deeper guidance is in the sections on forms and states, responsive behavior, AI features and the definition of done.\n", "tokens": {"name": "Storyloom Design System", "version": 1, "color": {"themes": [{"id": "light", "name": "Light"}, {"id": "dark", "name": "Dark"}], "tokens": [{"name": "color-neutral-0", "value": "#ffffff", "usage": "White (brand). Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-50", "value": "#f4f4f2", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-100", "value": "#ececea", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-200", "value": "#d9d9d6", "usage": "Light Gray (brand). Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-300", "value": "#bfc0bf", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-400", "value": "#a6a8a9", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-500", "value": "#888b8d", "usage": "Medium Gray (brand). Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-600", "value": "#63666a", "usage": "Dark Gray (brand). Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-700", "value": "#3e4147", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-800", "value": "#2e323a", "usage": "Derived step. Primitive: components take the semantic token that points at it, never this value."}, {"name": "color-neutral-900", "value": "#222731", "usage": "Cha
