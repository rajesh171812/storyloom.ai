        <li><div><b>Review and sign off</b><span>You get a .pptx plus the story used, exceptions and gaps (GATE-03).</span></div></li></ol>`) +
      sec("contents", "What's in the zip", `<div class="cx-pre"><pre class="cx-tree">${esc(tree)}</pre></div>`) +
      sec("single-files", "Single files", `<div class="cx-files">${FILES.slice(1).map(row).join("")}</div>`) +
      sec("template-decks", "Template decks", `<div class="cx-files">${XD.map(d => `<div class="cx-file"><span class="cx-ico">${ico("slides")}</span><div><b>${esc(d.file)}</b><small>${esc(d.type)}${d.mode ? " · " + esc(d.mode) : ""} · ${d.slides.length + 2} slides · built when you click</small></div><button type="button" class="bl-btn bl-btn--secondary bl-btn--sm" data-build="${d.key}">${ico("download")}Download</button></div>`).join("")}</div>`, "Lorem ipsum template decks with dummy numbers, one per presentation type and one per Experiment evidence mode. Preview them on the Presentation types page.") +
      sec("frame-files", "Device frame files", `<div class="cx-files">${frames.map(row).join("")}</div>`, "Full-resolution transparent PNGs. The screen area is transparent, so the screenshot goes underneath.");
  };

  PAGES.governance = () => pageHead("governance", "Every element carries one of five statuses. The status decides whether the AI can use it on its own, needs a condition, or has to ask.") +
    sec("levels", "The five levels", `<div class="cx-grid cx-grid--3">${R.governanceLevels.map(g => `<div class="bl-card cx-card" id="lvl-${g.id}">${badge(g.id)}<h3 class="bl-h4">${esc(g.name)}</h3><p class="cx-muted">${esc(g.rule)}</p><span class="cx-id">${esc(g.id)}</span></div>`).join("")}</div>`) +
    sec("badges", "Reading a badge", `<p>Status is never shown by color alone: every badge carries an icon and a word, so it reads in grayscale, in print and for screen readers.</p><div class="cx-chips">${Object.keys(ST).map(s => badge(s)).join(" ")}</div>`) +
    sec("extend", "Extending the system", `<p>Add a registry entry with a new ID and status. New types start Restricted until reviewed. Do not change assembly rules to add content. Update the .md spec, the registry JSON and this site together.</p>`);

  PAGES.tokens = () => {
    const sw = R.tokens.colors.map(([n, l, d, u]) => `<div class="cx-swatch" id="${slug(n)}"><div style="background:var(--${n})"></div><div><b>${esc(u)}</b><code>--${esc(n)}</code><span class="cx-muted bl-caption">Light ${l} · Dark ${d}</span></div></div>`).join("");
    const st = ["success", "warning", "error", "info"].map(s => `<div style="background:var(--color-status-${s}-bg);color:var(--color-status-${s}-fg);border-color:var(--color-status-${s}-border)">${ico({ success: "check", warning: "alert", error: "ban", info: "circleHelp" }[s])}${s[0].toUpperCase() + s.slice(1)}</div>`).join("");
    const sp = [[1, 4], [2, 8], [3, 12], [4, 16], [5, 24], [6, 32], [8, 48], [10, 80], [11, 96]].map(([n, px]) => `<div><span>space-${n} · ${px}</span><i style="width:var(--space-${n})"></i></div>`).join("");
    return pageHead("tokens", "Decks use Storyloom Design System semantic tokens, never raw values. Swatches below are live: they follow the light or dark theme you are viewing in.") +
      sec("color", "Color", `<div class="cx-grid cx-grid--3">${sw}</div><div class="cx-note">${ico("circleDot")}<p><b>Lavender is rationed.</b> Use <code class="bl-code">color-accent-bg</code> for at most one highlight per slide. Royal blue carries actions and emphasis; Deep navy carries title and section grounds. Periwinkle is a background only, with navy text.</p></div>`) +
      sec("dataviz", "Data-viz order", `<div class="cx-dv">${R.tokens.dataviz.map((c, i) => `<div style="background:var(--color-dataviz-${i + 1})">${i + 1}</div>`).join("")}</div><p class="cx-muted bl-body-sm">Use in order: ${R.tokens.dataviz.join(", ")}. Also separate series by label or shape.</p>`) +
      sec("status", "Status colors", `<div class="cx-status">${st}</div><p class="cx-muted bl-body-sm">Foreground on background, always with an icon and a word.</p>`) +
      sec("spacing", "Spacing and radius", `<p>${esc(R.tokens.spacing)}</p><div class="cx-space">${sp}</div><p>${esc(R.tokens.radius)}</p><div class="cx-radius"><div><i style="border-radius:var(--radius-sm)"></i>radius-sm 4</div><div><i style="border-radius:var(--radius-md)"></i>radius-md 8</div><div><i style="border-radius:var(--radius-lg)"></i>radius-lg 12</div><div><i style="border-radius:var(--radius-xl)"></i>radius-xl 16</div></div>`);
  };

  PAGES.typography = () => {
    const fam = { "Bricolage Grotesque": "var(--font-family-display)", "Hanken Grotesk": "var(--font-family-sans)", "IBM Plex Mono": "var(--font-family-mono)" };
    const sample = { "Slide title": "Today, the rescreen journey puts the work on the patient", "Section title": "02 · Friction", "Card title": "We remember for them", "KPI number": "+12 pts", "Body": "Returning patients already trust the test. The hard part is remembering and restarting.", "Label": "WHAT THE PATIENT DOES", "Source / footnote": "Source: Patient survey · online · n = 1,200", "IDs, data": "SLD-JOURNEY-01 · CMP-KPI-01" };
    const rows = R.tokens.slideType.map(([role, tok, face, size]) => { const f = Object.keys(fam).find(k => face.startsWith(k)); const w = face.match(/\d{3}/)[0]; const px = size.split(" / ")[0]; const lh = size.split(" / ")[1].split(" ")[0];
      return `<div class="cx-spec-row"><div style="font-family:${fam[f]};font-weight:${w};font-size:${px / 16}rem;line-height:${lh / 16}rem;overflow-wrap:anywhere">${esc(sample[role])}</div><div><b class="bl-label">${esc(role)}</b><br><small>${esc(tok)} · ${esc(face)} · ${esc(size)}</small></div></div>`; }).join("");
    return pageHead("typography", "Three typefaces from the Storyloom Design System, sized for a 1280 × 720 slide canvas. Sizes below are in canvas pixels; in PowerPoint multiply by 0.75 for points.") +
      sec("scale", "Slide type scale", `<div class="cx-spec">${rows}</div>`) +
      sec("faces", "Typefaces", `<div class="cx-grid cx-grid--3">${Object.entries(fam).map(([n, v], i) => `<div class="bl-card cx-card"><div style="font-family:${v};font-size:2.5rem;line-height:1;font-weight:${i === 0 ? 700 : 500}">Aa</div><h3 class="bl-h4">${n}</h3><p class="cx-muted bl-body-sm">${["Display: slide titles, KPI numbers, card titles", "Body: text, labels, footnotes", "Metadata: IDs and data only"][i]}</p></div>`).join("")}</div>
        <div class="cx-note cx-note--warn">${ico("alert")}<p><b>Install the fonts.</b> Decks name these families but do not embed them. Install all three (free on Google Fonts) on any machine that opens a deck.</p></div>`) +
      sec("hierarchy-order", "Content hierarchy on every slide", `<div class="cx-arrows">${R.slideHierarchy.map((s, i, a) => `<span>${s}</span>${i < a.length - 1 ? ico("arrowRight", "bl-icon bl-icon--sm") : ""}`).join("")}</div><p class="cx-muted">Never equal visual weight.</p>`);
  };

  PAGES.icons = () => {
    const V = R.icons.variants || [];
    const cats = R.icons.categories || [{ name: "Icons", items: R.icons.items }];
    const DEFV = (V.find(v => v.default) || { id: "outline" }).id;
    return pageHead("icons", esc(R.icons.library) + ". " + esc(R.icons.rules)) +
      sec("variants", "Variants", `<div class="cx-grid cx-grid--3">${V.map(v => `<div class="bl-card cx-card"><div class="cx-chips" style="gap:var(--space-3);align-items:center">${["target", "users", "lightbulb"].map(n => iconGlyph(n, v.id, 24)).join("")}</div><h3 class="bl-h4">${esc(v.name)}${v.default ? ` <span class="bl-badge bl-badge--accent">Default</span>` : ""}</h3><span class="cx-id">ICN-*${esc(v.suffix)}</span><p class="cx-muted bl-body-sm">${esc(v.rule)}</p></div>`).join("")}</div>`, "Every icon comes in three variants that share one ID stem. Rounded is the default on slides and in the template decks; outline is for icons inside pills, badges and tables.") +
      `<div class="cx-toolbar cx-icon-bar"><div class="cx-seg" role="group" aria-label="Icon variant">${V.map(v => `<button type="button" aria-pressed="${v.id === DEFV}" data-ivar="${v.id}">${esc(v.name)}${v.default ? " (default)" : ""}</button>`).join("")}</div><span class="cx-muted bl-body-sm">${R.icons.items.length} icons · copy the SVG for design tools.</span></div>` +
      cats.map((c, ci) => sec("icons-" + ci, esc(c.name), `<div class="cx-icons" data-icat="${ci}">${iconCells(c.items, DEFV, 0, ci)}</div>`, ci === 0 ? "The original 18 icons, kept with their short IDs." : `${c.items.length} icons`)).join("");
  };
  function iconGlyph(n, v, px = 32) {
    const inner = IC[n] || "";
    if (v === "outline") return `<svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:${px}px;height:${px}px">${inner}</svg>`;
    const fill = v === "rounded" ? "var(--color-state-selected-bg)" : "var(--color-action-primary-bg)";
    const ink = v === "rounded" ? "var(--color-action-primary-bg)" : "var(--color-action-primary-text)";
    return `<svg viewBox="0 0 40 40" aria-hidden="true" style="width:${px + 16}px;height:${px + 16}px"><rect width="40" height="40" rx="12" fill="${fill}"/><svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${inner}</svg></svg>`;
  }
  const ICON_FIRST = {}; (R.icons.categories || []).forEach((c, ci) => c.items.forEach(([id]) => { if (!(id in ICON_FIRST)) ICON_FIRST[id] = ci; }));
  function iconCells(items, v, anchors, ci) {
    const sfx = ((R.icons.variants || []).find(x => x.id === v) || { suffix: "" }).suffix;
    return items.map(([id, n, note]) => `<div class="cx-icon-cell" ${ICON_FIRST[id] === ci ? `id="${slug(id)}"` : ""} title="${esc(note || "")}">${iconGlyph(n, v)}<span class="cx-id">${esc(id + sfx)}</span><small>${esc(n)}${note ? " *" : ""}</small><button type="button" class="bl-btn bl-btn--ghost bl-btn--sm" data-svg="${esc(n)}" data-variant="${v}" aria-label="Copy ${esc(n)} SVG">${ico("copy")}SVG</button></div>`).join("");
  }
  window.__iconSvg = (n, v) => { const inner = IC[n] || ""; if (v === "outline") return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    const fill = v === "rounded" ? "#EEF0FE" : "#2E4AED", ink = v === "rounded" ? "#2E4AED" : "#FFFFFF";
    return `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="${fill}"/><svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${inner}</svg></svg>`; };


  /* Template deck previews (built by js/cxdeck.js) */

  const tplPrompt = d => `Use ${d.type} with ${d.story}${d.mode ? `, evidence mode ${d.mode}` : ""}. Here is my objective, audience and data: …`;
  function tplInner(d) {
    const sl = tplSlides(d);
    return `<div class="cx-tpl-main"><img src="img/templates/${d.key}/s-01.jpg" alt="${esc(d.name)} template, slide 1: Title" data-main></div>
      <div class="cx-cap" data-cap><span><b>01 · Title</b></span><span class="cx-id">SLD-TITLE-01</span></div>
      <div class="cx-thumbs" aria-label="Slides in this template">${sl.map(([p, id], i) => { const n = String(i + 1).padStart(2, "0"); return `<button type="button" data-thumb="${n}" data-purpose="${esc(p)}" data-id="${esc(id)}" aria-current="${i === 0}" aria-label="Slide ${n}: ${esc(p)}"><img src="img/templates/${d.key}/s-${n}.jpg" alt="" loading="lazy"><span>${n} · ${esc(p)}</span></button>`; }).join("")}</div>
      <div class="cx-actions"><button type="button" class="bl-btn bl-btn--primary" data-build="${d.key}">${ico("download")}Download .pptx</button><button type="button" class="bl-btn bl-btn--secondary" data-copy-text="${esc(tplPrompt(d))}">${ico("copy")}Copy AI prompt</button></div>
      <p class="cx-muted bl-body-sm" style="margin:0">${sl.length} slides · <code class="bl-code">${esc(d.file)}</code> · lorem ipsum copy and dummy numbers, with a title slide and a how-to slide. Fully editable in PowerPoint.</p>`;
  }
  function tplBlock(t) {

      ${ds.length > 1 ? `<p class="cx-muted bl-body-sm" style="margin:0">One deck per evidence mode. Only the Results slide changes.</p>` : ""}
      <div data-tpl-body>${tplInner(ds[0])}</div></div>`;

  PAGES["presentation-types"] = () => {
    const tplName = id => (R.slideTemplates.find(t => t.id === id) || {}).name || id;

      R.presentationTypes.map(t => sec(slug(t.id), esc(t.name), `<div class="bl-card cx-card"><div class="cx-card-top">${idTag(t.id)}${badge(t.status)}</div><p>${esc(t.purpose)}</p><dl class="cx-meta"><dt>Select when</dt><dd>${esc(t.signals)}</dd><dt>Story</dt><dd>${link(t.story)}</dd></dl>
        <ol class="cx-seq">${t.sequence.map((s, i) => `<li><span>${esc(s)} <span class="cx-muted">· ${esc(tplName(t.templates[i]))}</span></span>${link(t.templates[i])}</li>`).join("")}</ol>
        ${t.evidenceModes ? `<h3 class="bl-h4">Evidence modes</h3><dl class="cx-meta">${t.evidenceModes.map(m => `<dt>${esc(m.mode)}</dt><dd>${linkify(m.use)}</dd>`).join("")}</dl>` : ""}
        ${tplBlock(t)}</div>`)).join("") +
      sec("future", "Future types", `<p>Add these as new TPL entries that reuse existing templates. They start Restricted until reviewed.</p><div class="cx-chips">${R.futureTypes.map(f => `<span class="bl-tag">${esc(f)}</span>`).join("")}</div>`);
  };

  PAGES["story-structures"] = () => pageHead("story-structures", "The narrative spine of a deck. If several apply, pick the primary structure and borrow approved patterns from the secondary.") +
    sec("structures", "Structures", `<div class="cx-grid cx-grid--2">${R.storyStructures.map(s => `<div class="bl-card cx-card" id="${slug(s.id)}"><div class="cx-card-top">${idTag(s.id)}${badge(s.status)}</div><h3 class="bl-h4">${esc(s.name)}</h3><div class="cx-arrows">${s.flow.map((f, i, a) => `<span>${esc(f)}</span>${i < a.length - 1 ? ico("arrowRight", "bl-icon bl-icon--sm") : ""}`).join("")}</div><p class="cx-muted bl-body-sm">${esc(s.when)}</p></div>`).join("")}</div>`);

  PAGES.rules = () => pageHead("rules", "Thirteen rules every deck is checked against before the final review.") +
    sec("list", "Rules", table(["ID", "Rule"], R.storyRules.map((x, i) => { const id = "RULE-" + String(i + 1).padStart(2, "0"); return `<tr id="${slug(id)}"><td>${idTag(id)}</td><td>${esc(x)}</td></tr>`; }))) +
    sec("hier", "Slide hierarchy", `<div class="cx-arrows">${R.slideHierarchy.map((s, i, a) => `<span>${s}</span>${i < a.length - 1 ? ico("arrowRight", "bl-icon bl-icon--sm") : ""}`).join("")}</div>`);

  PAGES["slide-templates"] = () => {
    const usedIn = id => R.presentationTypes.filter(t => t.templates.includes(id)).map(t => t.id);
    const cards = R.slideTemplates.map(t => { const ex = EX[t.id];
      return `<article class="bl-card cx-card ${t.status === "deprecated" ? "cx-dep" : ""}" id="${slug(t.id)}" data-status="${t.status}">
        <div class="cx-media" data-media>${wf(t.id)}${ex ? ex.map(n => `<img src="img/slides/s-${String(n).padStart(2, "0")}.jpg" alt="Slide ${n} of the Cologuard rescreen deck, an example of ${esc(t.name)}" loading="lazy" hidden>`).join("") : ""}</div>
        <div class="cx-card-top"><h3 class="bl-h4">${esc(t.name)}</h3>${badge(t.status)}</div>
        <div class="cx-card-top">${idTag(t.id)}${ex ? `<div class="cx-seg" role="group" aria-label="Preview for ${esc(t.id)}"><button type="button" aria-pressed="true" data-view="wf">Wireframe</button>${ex.map((n, i) => `<button type="button" aria-pressed="false" data-view="${i}">Example${ex.length > 1 ? " " + (i + 1) : ""}</button>`).join("")}</div>` : ""}</div>
        <p class="cx-muted">${esc(t.purpose)}</p>
        ${t.condition ? `<div class="cx-note cx-note--warn">${ico("alert")}<p><b>Condition:</b> ${esc(t.condition)}</p></div>` : ""}
</article>`; }).join("");
    return pageHead("slide-templates", "Each template is a governed layout. The wireframe is the spec; where the Cologuard rescreen deck uses the template, you can switch to the real slide.") +
      sec("all", "All templates", `<div class="cx-filter" role="group" aria-label="Filter by status"><button type="button" aria-pressed="true" data-f="all">All ${R.slideTemplates.length}</button>${Object.keys(ST).filter(s => R.slideTemplates.some(t => t.status === s)).map(s => `<button type="button" aria-pressed="false" data-f="${s}">${ST[s].label} ${R.slideTemplates.filter(t => t.status === s).length}</button>`).join("")}</div><div class="cx-grid cx-grid--2" id="tplGrid">${cards}</div>`);
  };

  PAGES.components = () => pageHead("components", "The parts slide templates are built from, each with a schematic preview. Group headings follow the registry categories.") +
    R.componentCategories.map(cat => sec("cat-" + cat.toLowerCase(), cat, table(["Preview", "ID", "Name", "Status", "Use"], R.components.filter(c => c.cat === cat).map(c => `<tr id="${slug(c.id)}" class="${c.status === "deprecated" ? "cx-dep" : ""}"><td class="cx-prev">${mini(c.id)}</td><td>${idTag(c.id)}</td><td><b>${esc(c.name)}</b></td><td>${badge(c.status)}</td><td>${esc(c.use)}</td></tr>`)))).join("");

    const X = window.CXDeck, icons = {}, frames = {};
    await Promise.all(X.ICON_NAMES.flatMap(n => X.ICON_COLORS.map(async c => { icons[n + "-" + c] = await toData(`img/icons/${n}-${c}.png`); })));
    await Promise.all(Object.entries(X.FRAMES).map(async ([k, f]) => { frames[k] = await toData("files/frames/" + f.file); }));
    return (ASSETS = { icon: (n, c) => icons[n + "-" + c] || null, frame: k => frames[k] || null });
  }
  async function buildDeck(btn) {
    const api = await getSaver();
    const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="bl-spinner bl-spinner--sm" aria-hidden="true"></span>Building deck…`;
    try {
      await loadScript("js/pptxgen.bundle.js");
      const A = await loadAssets();
      const { pres, deck } = window.CXDeck.build(window.PptxGenJS, btn.dataset.build, A);
      const blob = await pres.write({ outputType: "blob" });
      await api.save({ filename: deck.file, data: blob });
      say(`Saved ${deck.file}`);
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") say("Download cancelled");
      else if (code === "rate_limited") say("A download prompt is already open");
      else say("Couldn't build the deck. Try again in a moment.");
    } finally { btn.disabled = false; btn.innerHTML = label; }
  }

  /* Search */
  const q = $("#q"), qr = $("#qResults"); let hits = [], sel = -1;
  function renderHits() {
    const v = q.value.trim().toLowerCase();
    if (!v) { qr.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
    hits = INDEX.filter(e => e.id.toLowerCase().includes(v) || String(e.name).toLowerCase().includes(v)).slice(0, 10);
    sel = hits.length ? 0 : -1;
    qr.innerHTML = hits.length ? hits.map((h, i) => `<a href="#${slug(h.id)}" role="option" id="hit${i}" aria-selected="${i === sel}"><code>${esc(h.id)}</code><span>${esc(h.name)}</span><small>${esc(h.kind)}</small></a>`).join("") : `<p>No match for “${esc(q.value)}”. Try an ID prefix like SLD, CMP or GAP.</p>`;
    qr.hidden = false; q.setAttribute("aria-expanded", "true");
  }
  q.addEventListener("input", renderHits);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!hits.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; qr.querySelectorAll("a").forEach((a, i) => a.setAttribute("aria-selected", String(i === sel))); q.setAttribute("aria-activedescendant", "hit" + sel); }
    else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); location.hash = slug(hits[sel].id); q.value = ""; renderHits(); q.blur(); }
    else if (e.key === "Escape") { q.value = ""; renderHits(); }
  });
  qr.addEventListener("click", e => { if (e.target.closest("a")) { q.value = ""; setTimeout(renderHits, 0); } });
  document.addEventListener("click", e => { if (!e.target.closest(".cx-search")) { qr.hidden = true; q.setAttribute("aria-expanded", "false"); } });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } if (e.key === "Escape") closeNav(); });

  /* Mobile nav */
  const menuBtn = $("#menuBtn");
  function closeNav() { document.body.classList.remove("cx-nav-open"); menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-label", "Open navigation"); }
  menuBtn.addEventListener("click", () => { const open = !document.body.classList.contains("cx-nav-open"); document.body.classList.toggle("cx-nav-open", open); menuBtn.setAttribute("aria-expanded", String(open)); menuBtn.setAttribute("aria-label", open ? "Close navigation" : "Open navigation"); });
  $("#scrim").addEventListener("click", closeNav);

  /* Theme */
  const root = document.documentElement, themeBtn = $("#themeBtn");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  function syncTheme() { const d = isDark(); $("#themeIco").innerHTML = d ? IC.sun : IC.moon; themeBtn.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme"); }
  try { const s = localStorage.getItem("cx-theme"); if (s) root.dataset.theme = s; } catch (e) {}
  themeBtn.addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("cx-theme", root.dataset.theme); } catch (e) {} syncTheme(); });
  syncTheme();

  route();
})();
</script>
