<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SlideTemplates preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); align-items: start; }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))">
<div class="cx-slide cx-slide--title"><span class="cx-highlight" style="justify-self:start; font-size:1.4cqw; min-height:0; padding: .5cqw 1.2cqw">Concept for approval</span><p class="cx-slide__title" style="font-size:5cqw">Cologuard Rescreen Experience</p><p style="margin:0; font-size:1.8cqw; opacity:.85">Leadership review · [Month Year]</p></div>
<div class="cx-slide"><p class="cx-slide__kicker">Executive summary</p><p class="cx-slide__title">A connected rescreen conversation brings more patients back on time</p><div style="display:grid; grid-template-columns: repeat(3,1fr); gap: 2cqw"><div class="cx-kpi" style="padding:2cqw; gap:.6cqw"><p class="cx-eyebrow" style="font-size:1.2cqw">Problem</p><p class="cx-kpi__value" style="font-size:4.5cqw; line-height:1">38%</p></div><div class="cx-kpi" style="padding:2cqw; gap:.6cqw"><p class="cx-eyebrow" style="font-size:1.2cqw">Concept</p><p class="cx-kpi__value" style="font-size:4.5cqw; line-height:1">3 → 1</p></div><div class="cx-kpi" style="padding:2cqw; gap:.6cqw"><p class="cx-eyebrow" style="font-size:1.2cqw">Impact</p><p class="cx-kpi__value" style="font-size:4.5cqw; line-height:1">+12</p></div></div></div>
</div>
<p class="pv-cap" style="margin-top: var(--space-3)">SLD-TITLE-01 on the Deep navy ground · SLD-EXEC-SUMMARY-01 · dummy data</p>
</body>
</html>
