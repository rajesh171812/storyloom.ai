<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); align-items: start; }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }

  /* Native platform colors are allowed inside MSG-* only. */
  .msg { --blue: #0a84ff; --green: #34c759; --grey: #e9e9eb; place-items: stretch; align-content: start; display: flex; flex-direction: column; gap: 5px; padding: 26px 8px 8px; background: #ffffff; color: #111111; font: 400 8px/1.3 system-ui, sans-serif; border-radius: 18px; text-align: left; }
  .msg .hd { text-align: center; color: #6e6e73; } .msg .hd b { display: block; color: #111111; }
  .msg .b { max-width: 80%; padding: 4px 7px; border-radius: 10px; } .msg .in { background: var(--grey); align-self: flex-start; } .msg .out { background: var(--blue); color: #fff; align-self: flex-end; } .msg .sms { background: var(--green); color: #fff; align-self: flex-end; }
  .msg .rep { display: flex; flex-wrap: wrap; gap: 3px; } .msg .rep span { border: 1px solid var(--blue); color: var(--blue); border-radius: 9px; padding: 1px 6px; }
  .msg.lock { color: #fff; background: radial-gradient(120% 70% at 20% 10%, #33b0e4 0%, transparent 60%), radial-gradient(90% 60% at 90% 40%, #470a68 0%, transparent 65%), linear-gradient(160deg, #002a3a 0%, #222731 100%); }
  .msg .time { text-align: center; font-size: 26px; font-weight: 300; margin: 4px 0 8px; } .msg .nt { background: rgba(255,255,255,.85); color: #111; border-radius: 9px; padding: 5px 7px; } .msg .nt b { display: block; color: #6e6e73; font-weight: 500; }
</style>
