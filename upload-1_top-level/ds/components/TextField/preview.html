<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--space-4); color: var(--color-text-primary); font: var(--font-body); letter-spacing: var(--letter-spacing-body); -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pv-col { display: grid; gap: var(--space-4); }
  .pv-cap { margin: 0 0 var(--space-2); font: var(--font-caption); letter-spacing: var(--letter-spacing-caption); color: var(--color-text-secondary); }
  .pv-sec + .pv-sec { margin-top: var(--space-5); }
  .pv-narrow { max-width: 360px; }
  .pv-half { max-width: 480px; }
  .pv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5) var(--space-5); align-items: start; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../bundle.css">
<script>try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="bl-body">
<div class="pv-cols">
<div class="bl-field"><label class="bl-label" for="tf1">Email address</label><p class="bl-help" id="tf1h">We send invoices to this address.</p><input class="bl-input" id="tf1" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="tf1h"></div>
<div class="bl-field"><label class="bl-label" for="tf2">Hover state</label><input class="bl-input is-hover" id="tf2" type="text" value="Website redesign"></div>
<div class="bl-field"><label class="bl-label" for="tf3">Focus state</label><input class="bl-input is-focus" id="tf3" type="text" value="Northwind Ltd"></div>
<div class="bl-field"><label class="bl-label" for="tf4">Invoice number</label><input class="bl-input" id="tf4" type="text" value="INV-1042" disabled></div>
<div class="bl-field"><label class="bl-label" for="tf5">Account ID</label><input class="bl-input" id="tf5" type="text" value="acct_48213" readonly></div>
<div class="bl-field"><label class="bl-label" for="tf6">Email address</label><input class="bl-input" id="tf6" type="email" value="ana@example" aria-invalid="true" aria-describedby="tf6e"><p class="bl-error" id="tf6e"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>Enter an email address like name@example.com.</span></p></div>
<div class="bl-field"><label class="bl-label" for="tf7">Search invoices <span class="bl-label__opt">(optional)</span></label><div class="bl-input-wrap"><svg class="bl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="bl-input" id="tf7" type="search" placeholder="Customer or invoice number"><button class="bl-btn bl-btn--ghost bl-btn--icon bl-btn--sm bl-input-clear" type="button" aria-label="Clear search"><svg class="bl-icon bl-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
<div class="bl-field"><label class="bl-label" for="tf8">Note to customer <span class="bl-label__opt">(optional)</span></label><textarea class="bl-textarea" id="tf8" placeholder="Thanks for your business."></textarea></div>
</div>
</body>
</html>
